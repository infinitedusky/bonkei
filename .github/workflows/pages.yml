name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queued runs collapse to the latest, but a deploy that has started finishes
  # rather than being cancelled halfway (as in GitHub's Pages starter workflow).
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm build also builds the docs (BON-178): scripts/build-docs.mjs packs bonkei and @bonkei/vitepress and `npm install`s the tarballs
      # into docs/ (not a workspace member; npm ships with Node), then runs TypeDoc and vitepress build; assemble-pages puts them in dist/docs/.
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
