name: Nightly

# The docs run (pnpm docs:smoke: build the docs from packed tarballs, then every page in a browser) takes about fifteen minutes, so it
# runs here, once a night on main, and not on every pull request (BON-217). Start it by hand from Actions › Nightly › Run workflow.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

# a hand-started run while another is going waits for it instead of cancelling it
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bonkei build
      - run: pnpm exec playwright install --with-deps chromium
      # builds the docs itself (scripts/build-docs.mjs packs bonkei and @bonkei/vitepress into docs/.packs), so nothing from pnpm smoke is needed;
      # each step's result goes to the run's summary
      - name: The docs run, every page (BON-178)
        run: pnpm docs:smoke
        env:
          SMOKE_CHROMIUM: bundled
