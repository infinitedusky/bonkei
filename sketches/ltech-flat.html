<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LTech · flat (sketch)</title>
<style>
  :root { --pink: #ff42e6; --navy: #020a3d; --grey: #676c8b; --rule: #dcdcdc; --haze: #fff4fd; }
  body { margin: 0; background: #fff; color: var(--navy); font-family: "Inter Display", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 28px; border-bottom: 1px solid var(--rule); }
  header h1 { margin: 0; font-weight: 300; font-size: 28px; letter-spacing: -0.03em; }
  header span { font: 11px ui-monospace, Menlo, monospace; color: var(--grey); text-transform: uppercase; letter-spacing: .04em; }
  header span::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--pink); margin-right: 8px; }
  .stage {
    height: calc(100vh - 68px); min-height: 640px;
    /* the hero's ground: a faint dot grid, and pink haze in vertical bands at both sides */
    background:
      radial-gradient(circle, #8e95bd55 0.8px, transparent 1.1px) 0 0 / 22px 22px,
      repeating-linear-gradient(90deg, transparent 0 58px, #ffffff66 58px 60px),
      linear-gradient(90deg, #f6c8f0 0%, #fbe3f8 14%, #fff 30%, #fff 70%, #fbe3f8 86%, #f6c8f0 100%);
  }
  svg { width: 100%; height: 100%; display: block; }
  .tag { position: fixed; left: 24px; bottom: 16px; font: 10px ui-monospace, Menlo, monospace; color: var(--grey); text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<header>
  <h1>Checkout system</h1>
  <span>theme: ltech · flat · sketch, made-up diagram</span>
</header>
<div class="stage">
<svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- the arrowhead is the site's pink chevron (MESSAGE US >) -->
    <marker id="chev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2,1 L8,5 L2,9" fill="none" stroke="#ff42e6" stroke-width="1.6"/>
    </marker>
  </defs>
  <g id="scene"></g>
</svg>
</div>
<div class="tag">No glow anywhere. Pink only as small squares, chevrons and the tunnel line.</div>
<script>
const S = document.getElementById('scene'), NS = 'http://www.w3.org/2000/svg'
const el = (n, a, p = S) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e }
const mono = 'ui-monospace, Menlo, monospace'

// a tray: white-ish, hairline rule, its title as the site's section label: pink square, "01 · STOREFRONT" in mono caps
function tray(x, y, w, h, fill, n, title) {
  el('rect', { x, y, width: w, height: h, fill, stroke: '#c9cbd8', 'stroke-width': 1 })
  el('rect', { x: x + 20, y: y + 20, width: 8, height: 8, fill: '#ff42e6' })
  const t = el('text', { x: x + 38, y: y + 28, fill: '#020a3d', 'font-size': 12, 'font-family': mono, 'letter-spacing': '.06em' })
  t.textContent = `${n} · ${title.toUpperCase()}`
}
function node(x, y, w, h, label, kind = 'rect') {
  const ink = { stroke: '#020a3d', 'stroke-width': 1.2 }
  let text = '#020a3d'
  if (kind === 'rect') el('rect', { x, y, width: w, height: h, fill: '#fff', ...ink })
  if (kind === 'chip') { el('rect', { x, y, width: w, height: h, rx: 3, fill: '#111' }); el('rect', { x: x + w - 20, y: y + h / 2 - 4, width: 8, height: 8, fill: '#ff42e6' }); text = '#fff' }
  if (kind === 'cyl') {
    el('path', { d: `M${x},${y + 8} v${h - 16} a${w / 2},8 0 0 0 ${w},0 v${-(h - 16)}`, fill: '#fff', ...ink })
    el('ellipse', { cx: x + w / 2, cy: y + 8, rx: w / 2, ry: 8, fill: '#fff', ...ink })
  }
  if (kind === 'dia') el('path', { d: `M${x + w / 2},${y} L${x + w},${y + h / 2} L${x + w / 2},${y + h} L${x},${y + h / 2}z`, fill: '#fff4fd', ...ink })
  const t = el('text', { x: x + w / 2 - (kind === 'chip' ? 8 : 0), y: y + h / 2 + 5, fill: text, 'font-size': 15, 'text-anchor': 'middle', 'letter-spacing': '-.01em' }); t.textContent = label
}
function line(d, label, lx, ly) {
  el('path', { d, fill: 'none', stroke: '#020a3d', 'stroke-width': 1.2, 'marker-end': 'url(#chev)' })
  if (label) { const t = el('text', { x: lx, y: ly, fill: '#676c8b', 'font-size': 10, 'font-family': mono, 'text-anchor': 'middle', 'letter-spacing': '.06em', 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': 5 }); t.textContent = label.toUpperCase() }
}

tray(60, 60, 470, 560, '#ffffffd9', '01', 'Storefront')
tray(620, 60, 520, 560, '#ffffffd9', '02', 'Payments')
tray(660, 300, 440, 280, '#f6f6fa', '03', 'Ledger service')

node(130, 140, 150, 50, 'Web app', 'chip')
node(130, 300, 150, 56, 'Cart API')
node(330, 420, 150, 90, 'Fraud check?', 'dia')
node(130, 500, 150, 70, 'Sessions', 'cyl')
node(690, 140, 160, 56, 'Charge')
node(900, 140, 170, 50, 'Card network', 'chip')
node(700, 380, 150, 56, 'Post entry')
node(910, 370, 150, 80, 'Ledger DB', 'cyl')

line('M205,190 V298', 'checkout', 250, 250)
line('M205,356 V498', 'session', 245, 435)
line('M280,328 H405 V418', 'score', 345, 318)
line('M480,465 H560 V168 H688', 'approve', 600, 155)
line('M850,165 H898', '', 0, 0)
line('M770,196 V378', 'record', 815, 290)
line('M850,408 H908', '', 0, 0)

// a tunnel between trays: a thin pink line between two small pink squares (no glow)
el('path', { d: 'M534,560 H616', stroke: '#ff42e6', 'stroke-width': 1.5, 'stroke-dasharray': '4 3' })
el('rect', { x: 526, y: 556, width: 8, height: 8, fill: '#ff42e6' }); el('rect', { x: 616, y: 556, width: 8, height: 8, fill: '#ff42e6' })
const tl = el('text', { x: 575, y: 548, fill: '#676c8b', 'font-size': 10, 'font-family': mono, 'text-anchor': 'middle', 'letter-spacing': '.06em' }); tl.textContent = 'REFUND'
</script>
</body>
</html>
