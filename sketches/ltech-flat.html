<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LTech · flat (sketch)</title>
<style>
  :root { --pink: #ff42e6; --focus: #e02cc8; --midnight: #020a3d; --navy2: #0a1550; --char: #141414; --grey: #676c8b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fff; font-family: "Inter Display", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 28px; border-bottom: 1px solid #fff2; }
  header h1 { margin: 0; font-weight: 200; font-size: 26px; letter-spacing: -0.01em; }
  header h1 b { color: var(--pink); font-weight: 200; }
  header span { font: 12px ui-monospace, Menlo, monospace; color: var(--grey); }
  .stage {
    position: relative; margin: 0; height: calc(100vh - 66px); min-height: 640px; overflow: hidden;
    /* the site's own dot grid */
    background: radial-gradient(circle, #ffffff40 0.8px, transparent 1.1px) 0 0 / 24px 24px, #000;
  }
  svg { width: 100%; height: 100%; display: block; }
  .tag { position: absolute; left: 24px; bottom: 18px; font: 11px ui-monospace, Menlo, monospace; color: var(--grey); }
  .tag i { color: var(--pink); font-style: normal; }
</style>
</head>
<body>
<header>
  <h1>Checkout system <b>·</b> flat</h1>
  <span>theme: ltech — SKETCH, made-up diagram</span>
</header>
<div class="stage">
<svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- the pink halo under a line: tight, like the site's box-shadow 0 0 .25em -->
    <filter id="halo" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="6000" height="6000">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.2" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ff42e6" flood-opacity="0.85"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fff"/>
    </marker>
  </defs>

  <g id="scene"></g>
</svg>
<div class="tag">Pink appears only as: the glow on lines, the trench light, portals and hover. <i>■</i> = #ff42e6</div>
</div>

<script>
// Made-up diagram, drawn by hand for the sketch.
const S = document.getElementById('scene'), NS = 'http://www.w3.org/2000/svg'
const el = (n, a, p = S) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e }

// A tray seen from above: navy, thin white-alpha outline, corners stepped in pixels (the "pixel-stepped edge").
function tray(x, y, w, h, fill, title, step = 6) {
  const s = step, d = [
    `M${x + 3 * s},${y}`, `H${x + w - 3 * s}`, `v${s}h${s}v${s}h${s}v${s}`, `V${y + h - 3 * s}`,
    `h${-s}v${s}h${-s}v${s}h${-s}v${s}`, `H${x + 3 * s}`, `v${-s}h${-s}v${-s}h${-s}v${-s}`, `V${y + 3 * s}`,
    `h${s}v${-s}h${s}v${-s}h${s}z`].join('')
  el('path', { d, fill, stroke: '#ffffff55', 'stroke-width': 1 })
  const t = el('text', { x: x + 22, y: y + 30, fill: '#fff', 'font-size': 15, 'font-weight': 300 }); t.textContent = title
}
function node(x, y, w, h, label, kind = 'rect') {
  const g = el('g', {})
  if (kind === 'rect') el('rect', { x, y, width: w, height: h, fill: '#141414', stroke: '#fff', 'stroke-width': 1.3 }, g)
  if (kind === 'round') el('rect', { x, y, width: w, height: h, rx: h / 2, fill: '#1b1f3f', stroke: '#fff', 'stroke-width': 1.3 }, g)
  if (kind === 'cyl') {
    el('path', { d: `M${x},${y + 8} v${h - 16} a${w / 2},8 0 0 0 ${w},0 v${-(h - 16)}`, fill: '#0d1440', stroke: '#fff', 'stroke-width': 1.3 }, g)
    el('ellipse', { cx: x + w / 2, cy: y + 8, rx: w / 2, ry: 8, fill: '#18205a', stroke: '#fff', 'stroke-width': 1.3 }, g)
  }
  if (kind === 'dia') el('path', { d: `M${x + w / 2},${y} L${x + w},${y + h / 2} L${x + w / 2},${y + h} L${x},${y + h / 2}z`, fill: '#292929', stroke: '#fff', 'stroke-width': 1.3 }, g)
  const t = el('text', { x: x + w / 2, y: y + h / 2 + 5, fill: '#fff', 'font-size': 14, 'text-anchor': 'middle' }, g); t.textContent = label
  return g
}
function line(d, label, lx, ly) {
  el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 1.6, filter: 'url(#halo)', 'marker-end': 'url(#arrow)' })
  if (label) { const t = el('text', { x: lx, y: ly, fill: '#fff', 'font-size': 12, 'text-anchor': 'middle', 'paint-order': 'stroke', stroke: '#000', 'stroke-width': 4 }); t.textContent = label }
}

// trays: level 1 black-navy, level 2 midnight, level 3 a step lighter
tray(60, 60, 470, 560, '#05081f', 'Storefront')
tray(620, 60, 520, 560, '#05081f', 'Payments')
tray(660, 300, 440, 280, '#020a3d', 'Ledger service')

node(130, 140, 150, 56, 'Web app', 'round')
node(130, 300, 150, 56, 'Cart API')
node(330, 420, 150, 90, 'Fraud check?', 'dia')
node(130, 500, 150, 70, 'Sessions', 'cyl')

node(690, 140, 160, 56, 'Charge')
node(900, 140, 170, 56, 'Card network', 'round')
node(700, 380, 150, 56, 'Post entry')
node(910, 370, 150, 80, 'Ledger DB', 'cyl')

line('M205,196 V300', 'checkout', 245, 255)
line('M205,356 V500', 'session', 240, 435)
line('M280,328 H405 V420', 'score', 360, 318)
line('M480,465 H560 V168 H690', 'approve', 600, 155)
line('M850,168 H900', '', 0, 0)
line('M770,196 V380', 'record', 815, 290)
line('M850,408 H910', '', 0, 0)

// a trench (tunnel) crossing between trays: the floor-wall track, lit pink, with a soft wash
el('path', { d: 'M530,560 H620', stroke: '#ff42e6', 'stroke-width': 12, opacity: 0.35, filter: 'url(#soft)' })
el('path', { d: 'M530,560 H620', stroke: '#ff42e6', 'stroke-width': 2.5 })
el('circle', { cx: 530, cy: 560, r: 6, fill: '#000', stroke: '#ff42e6', 'stroke-width': 2 }) // portal
el('circle', { cx: 620, cy: 560, r: 6, fill: '#000', stroke: '#ff42e6', 'stroke-width': 2 })
const tl = el('text', { x: 575, y: 548, fill: '#fff', 'font-size': 12, 'text-anchor': 'middle' }); tl.textContent = 'refund (tunnel)'
</script>
</body>
</html>
