<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LTech · sequence (sketch)</title>
<style>
  :root { --pink: #ff42e6; --navy: #020a3d; --grey: #676c8b; --rule: #dcdcdc; }
  body { margin: 0; background: #fff; color: var(--navy); font-family: "Inter Display", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 28px; border-bottom: 1px solid var(--rule); }
  header h1 { margin: 0; font-weight: 300; font-size: 28px; letter-spacing: -0.03em; }
  header span { font: 11px ui-monospace, Menlo, monospace; color: var(--grey); text-transform: uppercase; letter-spacing: .04em; }
  header span::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--pink); margin-right: 8px; }
  .stage {
    height: calc(100vh - 68px); min-height: 640px;
    background:
      radial-gradient(circle, #8e95bd55 0.8px, transparent 1.1px) 0 0 / 22px 22px,
      repeating-linear-gradient(90deg, transparent 0 58px, #ffffff66 58px 60px),
      linear-gradient(90deg, #f6c8f0 0%, #fbe3f8 12%, #fff 26%, #fff 74%, #fbe3f8 88%, #f6c8f0 100%);
  }
  svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<header>
  <h1>Log in</h1>
  <span>theme: ltech · sequence · sketch, made-up diagram</span>
</header>
<div class="stage">
<svg viewBox="0 0 1100 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="chev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2,1 L8,5 L2,9" fill="none" stroke="#ff42e6" stroke-width="1.6"/>
    </marker>
  </defs>
  <g id="scene"></g>
</svg>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg', S = document.getElementById('scene')
const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); S.appendChild(e); return e }
const mono = 'ui-monospace, Menlo, monospace'
const txt = (x, y, s, a = {}) => { const t = el('text', { x, y, fill: '#020a3d', 'font-size': 14, 'text-anchor': 'middle', ...a }); t.textContent = s; return t }
const cap = (x, y, s, a = {}) => txt(x, y, s.toUpperCase(), { fill: '#676c8b', 'font-size': 10, 'font-family': mono, 'letter-spacing': '.06em', ...a })

const who = [['Browser', 140], ['Auth API', 420], ['User DB', 700], ['Mailer', 960]]
// lifelines: hairline grey rules
for (const [, x] of who) el('line', { x1: x, y1: 90, x2: x, y2: 650, stroke: '#c9cbd8', 'stroke-width': 1 })
// participants: the site's black button with its pink square
for (const [n, x] of who) {
  el('rect', { x: x - 72, y: 40, width: 144, height: 44, rx: 3, fill: '#111' })
  txt(x - 8, 67, n, { fill: '#fff', 'font-size': 15 })
  el('rect', { x: x + 50, y: 58, width: 8, height: 8, fill: '#ff42e6' })
}
// activations: thin pink bars
el('rect', { x: 416, y: 140, width: 8, height: 300, fill: '#ff42e6' })
el('rect', { x: 696, y: 180, width: 8, height: 80, fill: '#ff42e6', opacity: 0.6 })

const msg = (x1, x2, y, label, dashed) => {
  el('line', { x1, y1: y, x2, y2: y, stroke: '#020a3d', 'stroke-width': 1.2, 'marker-end': 'url(#chev)', ...(dashed ? { 'stroke-dasharray': '5 4' } : {}) })
  txt((x1 + x2) / 2, y - 9, label, { 'font-size': 13 })
}
msg(140, 414, 140, 'POST /login (email, password)')
msg(426, 694, 180, 'find user by email')
msg(694, 426, 260, 'user row', true)

// a note: pink haze, hairline rule
el('rect', { x: 470, y: 290, width: 230, height: 48, fill: '#fff4fd', stroke: '#e9b8e2', 'stroke-width': 1 })
txt(585, 319, 'check password hash', { 'font-size': 13 })

// an alt block: hairline frame, the label as a section label (pink square, mono caps)
el('rect', { x: 90, y: 365, width: 940, height: 210, fill: '#ffffffb0', stroke: '#c9cbd8', 'stroke-width': 1 })
el('rect', { x: 106, y: 378, width: 8, height: 8, fill: '#ff42e6' })
cap(122, 386, 'alt · password ok', { 'text-anchor': 'start', fill: '#020a3d' })
msg(414, 140, 420, 'session cookie', true)
el('line', { x1: 90, y1: 470, x2: 1030, y2: 470, stroke: '#c9cbd8', 'stroke-dasharray': '4 4' })
cap(106, 490, 'else · 3 failures', { 'text-anchor': 'start' })
msg(426, 958, 520, 'send lockout email')
el('path', { d: 'M950,555 l20,20 M970,555 l-20,20', stroke: '#ff42e6', 'stroke-width': 2 })
</script>
</body>
</html>
