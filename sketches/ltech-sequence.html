<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LTech · sequence (sketch)</title>
<style>
  :root { --pink: #ff42e6; --grey: #676c8b; }
  body { margin: 0; background: #000; color: #fff; font-family: "Inter Display", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 28px; border-bottom: 1px solid #fff2; }
  header h1 { margin: 0; font-weight: 200; font-size: 26px; }
  header h1 b { color: var(--pink); font-weight: 200; }
  header span { font: 12px ui-monospace, Menlo, monospace; color: var(--grey); }
  .stage { height: calc(100vh - 66px); min-height: 640px; background: radial-gradient(circle, #ffffff40 0.8px, transparent 1.1px) 0 0 / 24px 24px, #000; }
  svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<header>
  <h1>Log in <b>·</b> sequence</h1>
  <span>theme: ltech — SKETCH, made-up diagram</span>
</header>
<div class="stage">
<svg viewBox="0 0 1100 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="halo" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="6000" height="6000">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.2" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ff42e6" flood-opacity="0.85"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#fff" stroke-width="1.5"/></marker>
  </defs>
  <g id="scene"></g>
</svg>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg', S = document.getElementById('scene')
const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); S.appendChild(e); return e }
const txt = (x, y, s, a = {}) => { const t = el('text', { x, y, fill: '#fff', 'font-size': 14, 'text-anchor': 'middle', ...a }); t.textContent = s; return t }

const who = [['Browser', 140], ['Auth API', 420], ['User DB', 700], ['Mailer', 960]]
// lifelines in Lazer grey, dashed
for (const [, x] of who) el('line', { x1: x, y1: 90, x2: x, y2: 650, stroke: '#676c8b', 'stroke-width': 1.2, 'stroke-dasharray': '5 5' })
// participants: dark boxes, white outline, pixel-stepped corners
for (const [n, x] of who) {
  const w = 150, h = 46, y = 40, s = 4, l = x - w / 2
  el('path', { d: `M${l + 2 * s},${y}H${l + w - 2 * s}v${s}h${s}v${s}h${s}V${y + h - 2 * s}h${-s}v${s}h${-s}v${s}H${l + 2 * s}v${-s}h${-s}v${-s}h${-s}V${y + 2 * s}h${s}v${-s}h${s}z`, fill: '#020a3d', stroke: '#fff', 'stroke-width': 1.2 })
  txt(x, y + 28, n, { 'font-weight': 300, 'font-size': 15 })
}
// activations in pink
el('rect', { x: 413, y: 140, width: 14, height: 300, fill: '#ff42e6' })
el('rect', { x: 693, y: 180, width: 14, height: 80, fill: '#e02cc8' })

const msg = (x1, x2, y, label, dashed) => {
  el('line', { x1, y1: y, x2, y2: y, stroke: '#fff', 'stroke-width': 1.5, filter: 'url(#halo)', 'marker-end': dashed ? 'url(#open)' : 'url(#arrow)', ...(dashed ? { 'stroke-dasharray': '6 5' } : {}) })
  txt((x1 + x2) / 2, y - 9, label, { 'font-size': 13 })
}
msg(140, 413, 140, 'POST /login (email, password)')
msg(427, 693, 180, 'find user by email')
msg(693, 427, 260, 'user row', true)

// a note: midnight with white text, thin pink edge
el('rect', { x: 470, y: 290, width: 230, height: 48, fill: '#020a3d', stroke: '#ff42e6', 'stroke-width': 1 })
txt(585, 319, 'check password hash', { 'font-size': 13 })

// an alt block
el('rect', { x: 90, y: 365, width: 940, height: 210, fill: 'none', stroke: '#ffffff66', 'stroke-width': 1 })
el('rect', { x: 90, y: 365, width: 80, height: 22, fill: '#ffffff' })
txt(130, 381, 'alt', { fill: '#000', 'font-size': 12, 'font-family': 'ui-monospace, Menlo, monospace' })
txt(260, 381, '[password ok]', { fill: '#dcdcdc', 'font-size': 12, 'font-family': 'ui-monospace, Menlo, monospace' })
msg(413, 140, 420, 'session cookie', true)
el('line', { x1: 90, y1: 470, x2: 1030, y2: 470, stroke: '#ffffff44', 'stroke-dasharray': '4 4' })
txt(160, 488, '[3 failures]', { fill: '#dcdcdc', 'font-size': 12, 'font-family': 'ui-monospace, Menlo, monospace' })
msg(427, 960, 520, 'send lockout email')
// a cross (destroyed): pink
el('path', { d: 'M950,555 l20,20 M970,555 l-20,20', stroke: '#ff42e6', 'stroke-width': 2.5 })
</script>
</body>
</html>
