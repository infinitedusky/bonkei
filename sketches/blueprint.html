<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sketch: Blueprint theme (BON-234)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
  /* SKETCH, MADE-UP SAMPLE DATA. A rough stand-in for the 3D scene: CSS 3D boxes, not three.js. */
  :root {
    --paper: #1d4f8c; --grid: rgba(220,236,255,.13); --major: rgba(220,236,255,.30);
    --ink: #eef6ff; --line: #a9d6ff; --tray-ink: #bcdcff;
    --fill: #2862a6; --side: #22579a; --tray: #22599a; --tray2: #26609f; --tray-side: #1f5290;
    --accent: #ffd479;
  }
  body.outline-only { --fill: var(--paper); --side: var(--paper); --tray: var(--paper); --tray2: var(--paper); --tray-side: var(--paper); }
  * { box-sizing: border-box }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #0d1117; color: #e6edf3 }
  header { padding: 12px 18px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #222 }
  header h1 { font-size: 15px; margin: 0 12px 0 0 }
  .grp { display: flex; gap: 4px; align-items: center }
  .grp span { color: #8b949e; margin-right: 4px }
  button { font: inherit; background: #1b222c; color: #e6edf3; border: 1px solid #333; padding: 4px 10px; border-radius: 6px; cursor: pointer }
  button[aria-pressed=true] { background: #2f6feb; border-color: #2f6feb }
  label { display: flex; gap: 5px; align-items: center; cursor: pointer; color: #c9d1d9 }
  .note { color: #8b949e; font-size: 12px; padding: 6px 18px }
  .view { position: relative; height: calc(100vh - 120px); min-height: 520px; margin: 0 18px 18px; overflow: hidden; border-radius: 10px; background: var(--paper) }
  .view.p3d { perspective: 1500px }
  .world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; transition: transform .6s ease }
  .plane { position: absolute; transform-style: preserve-3d;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px) }
  body.major .plane { background-image:
    linear-gradient(var(--major) 1px, transparent 1px), linear-gradient(90deg, var(--major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px) }
  .g { position: absolute; transform-style: preserve-3d }
  .f { position: absolute; border: 1.5px solid var(--ink); background: var(--fill) }
  .f.s { background: var(--side) }
  .tray > .f { border-color: var(--tray-ink); background: var(--tray) }
  .tray.l2 > .f { background: var(--tray2) }
  .tray > .f.s { background: var(--tray-side) }
  body.hatch .tray > .f.s { background-image: repeating-linear-gradient(45deg, transparent 0 5px, rgba(200,228,255,.55) 5px 6.5px) }
  .ring { position: absolute; inset: 0; border: 1.2px solid var(--ink); border-radius: inherit }
  .lab { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--ink); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; pointer-events: none }
  body.letter .lab, body.letter .ttl { font-family: 'Architects Daughter', cursive; font-weight: 400; font-size: 14px; letter-spacing: .04em }
  .ttl { position: absolute; color: var(--tray-ink); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 7px; border: 1px solid var(--tray-ink) }
  svg.edges { position: absolute; overflow: visible }
  svg.edges path { fill: none; stroke: var(--line); stroke-width: 2 }
  svg.edges .dash { stroke-dasharray: 7 5 }
  svg.edges text { fill: var(--line); font: 12px system-ui; letter-spacing: .04em }
  body.letter svg.edges text { font-family: 'Architects Daughter', cursive; font-size: 14px }
  .stamp { position: absolute; right: 16px; bottom: 14px; color: var(--tray-ink); border: 1px solid var(--tray-ink); padding: 6px 10px; font: 11px system-ui; letter-spacing: .12em; text-transform: uppercase; opacity: .8 }
</style>
</head>
<body class="major">
<header>
  <h1>Blueprint · sketch</h1>
  <div class="grp"><span>Diagram</span><button data-d="flow" aria-pressed="true">Flowchart</button><button data-d="seq">Sequence</button></div>
  <div class="grp"><span>View</span><button data-v="flat">Flat</button><button data-v="iso" aria-pressed="true">Iso</button><button data-v="3d">3D</button></div>
  <div class="grp"><span>Extras (need code)</span>
    <label><input type="checkbox" data-c="major" checked> heavier grid line every 5</label>
    <label><input type="checkbox" data-c="hatch"> hatched tray sides</label>
    <label><input type="checkbox" data-c="letter"> architect's lettering</label>
  </div>
  <div class="grp"><span>Fill</span><label><input type="checkbox" data-c="outline-only"> outline only (fill = paper)</label></div>
</header>
<div class="note">Made-up sample data. A rough CSS stand-in for the real 3D scene: shapes, heights and line routes are approximate; the colours, grid and line work are what this sketch is for.</div>
<div class="view" id="view"><div class="world" id="world"></div><div class="stamp">theme: blueprint</div></div>

<script>
const G = 20 // grid square in px (one world unit)
const PAD = 400
const DIAGRAMS = {
  flow: {
    W: 900, H: 500,
    trays: [
      { x: 360, y: 20, w: 340, d: 290, z: 0, h: 14, title: 'Services' },
      { x: 380, y: 160, w: 300, d: 130, z: 14, h: 12, title: 'Billing', l2: true },
      { x: 360, y: 340, w: 340, d: 140, z: 0, h: 14, title: 'Data' },
    ],
    nodes: [
      { id: 'Client', x: 20, y: 200, w: 120, d: 60, z: 0, shape: 'rect' },
      { id: 'API gateway', x: 180, y: 200, w: 140, d: 60, z: 0, shape: 'rect' },
      { id: 'Auth', x: 400, y: 60, w: 80, d: 80, z: 14, shape: 'circle' },
      { id: 'Orders', x: 540, y: 70, w: 130, d: 60, z: 14, shape: 'rect' },
      { id: 'Invoices', x: 400, y: 200, w: 120, d: 60, z: 26, shape: 'rect' },
      { id: 'Paid?', x: 570, y: 195, w: 70, d: 70, z: 26, shape: 'diamond' },
      { id: 'Postgres', x: 390, y: 380, w: 110, d: 70, z: 14, shape: 'cyl' },
      { id: 'Cache', x: 560, y: 375, w: 80, d: 80, z: 14, shape: 'circle' },
    ],
    edges: [
      ['M140 230 H180'], ['M320 220 H360 V100 H400'], ['M320 240 H350 V30 H605 V70'],
      ['M605 130 V160 H460 V200'], ['M520 230 H570'], ['M670 100 H720 V415 H500'], ['M440 140 V170 H700 V500 H600 V455'],
    ],
  },
  seq: {
    W: 880, H: 500,
    trays: [],
    nodes: ['Browser', 'API', 'Auth', 'Postgres'].map((id, i) => ({ id, x: 40 + i * 220, y: 10, w: 140, d: 56, z: 0, shape: 'rect' })),
    acts: [{ x: 324, y: 110, d: 270 }, { x: 544, y: 150, d: 130 }],
    note: { x: 245, y: 300, w: 170, d: 40, text: 'sets the cookie' },
    life: [110, 330, 550, 770],
    msgs: [
      { y: 120, a: 0, b: 1, t: 'POST /login' }, { y: 160, a: 1, b: 2, t: 'check password' }, { y: 200, a: 2, b: 3, t: 'find user' },
      { y: 240, a: 3, b: 2, t: 'row', dash: true }, { y: 275, a: 2, b: 1, t: 'token', dash: true }, { y: 370, a: 1, b: 0, t: '200 OK', dash: true },
    ],
  },
}
const NODE_H = 26
const el = (cls, css = {}, parent) => { const e = document.createElement('div'); e.className = cls; Object.assign(e.style, css); parent?.appendChild(e); return e }
const px = n => n + 'px'

function box(parent, { x, y, w, d, z, h, rot, radius, cls = '', rings }) {
  const g = el('g ' + cls, { left: px(x), top: px(y), width: px(w), height: px(d), transform: rot ? `rotateZ(${rot}deg)` : '' }, parent)
  if (rings) {
    for (let i = 0; i <= rings; i++) el('g', { left: 0, top: 0, width: px(w), height: px(d), borderRadius: radius, transform: `translateZ(${z + (h * i) / rings}px)` }, g).appendChild(el('ring'))
    el('f', { left: 0, top: 0, width: px(w), height: px(d), borderRadius: radius, transform: `translateZ(${z + h}px)` }, g)
    return g
  }
  el('f s', { left: 0, top: px(d), width: px(w), height: px(h), transformOrigin: 'top', transform: `translateZ(${z}px) rotateX(90deg)` }, g)
  el('f s', { left: 0, top: px(-h), width: px(w), height: px(h), transformOrigin: 'bottom', transform: `translateZ(${z}px) rotateX(-90deg)` }, g)
  el('f s', { left: px(w), top: 0, width: px(h), height: px(d), transformOrigin: 'left', transform: `translateZ(${z}px) rotateY(-90deg)` }, g)
  el('f s', { left: px(-h), top: 0, width: px(h), height: px(d), transformOrigin: 'right', transform: `translateZ(${z}px) rotateY(90deg)` }, g)
  el('f', { left: 0, top: 0, width: px(w), height: px(d), borderRadius: radius || 0, transform: `translateZ(${z + h}px)` }, g)
  return g
}

function draw(name) {
  const D = DIAGRAMS[name], world = document.getElementById('world')
  world.innerHTML = ''
  const PW = D.W + PAD * 2, PH = D.H + PAD * 2
  const plane = el('plane', { left: px(-PW / 2), top: px(-PH / 2), width: px(PW), height: px(PH), backgroundSize: '' }, world)
  plane.dataset.size = '1'
  const at = el('g', { left: px(PAD), top: px(PAD), width: px(D.W), height: px(D.H) }, plane)

  for (const t of D.trays) {
    box(at, { ...t, cls: 'tray' + (t.l2 ? ' l2' : '') })
    el('ttl', { left: px(t.x + 8), top: px(t.y + 8), transform: `translateZ(${t.z + t.h + 1}px)` }, at).textContent = t.title
  }
  // sequence: lifelines, activations, note lie on the paper
  let svg = `<svg class="edges" width="${D.W}" height="${D.H}" style="left:0;top:0;transform:translateZ(${name === 'seq' ? 1 : 44}px)">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--line);stroke:none"/></marker></defs>`
  if (name === 'flow') for (const [d] of D.edges) svg += `<path d="${d}" marker-end="url(#ah)"/>`
  if (name === 'seq') {
    for (const x of D.life) svg += `<path class="dash" d="M${x} 66 V${D.H - 10}" style="stroke:var(--tray-ink);stroke-width:1.3;opacity:.8"/>`
    for (const m of D.msgs) {
      const a = D.life[m.a], b = D.life[m.b], dir = b > a ? 1 : -1
      svg += `<path ${m.dash ? 'class="dash"' : ''} d="M${a + dir * 12} ${m.y} H${b - dir * 14}" marker-end="url(#ah)"/><text x="${(a + b) / 2}" y="${m.y - 7}" text-anchor="middle">${m.t}</text>`
    }
  }
  at.insertAdjacentHTML('beforeend', svg + '</svg>')
  if (name === 'seq') {
    for (const a of D.acts) box(at, { x: a.x, y: a.y, w: 12, d: a.d, z: 0, h: 10 })
    box(at, { x: D.note.x, y: D.note.y, w: D.note.w, d: D.note.d, z: 0, h: 6 })
    el('lab', { left: px(D.note.x), top: px(D.note.y), width: px(D.note.w), height: px(D.note.d), transform: 'translateZ(7px)', textTransform: 'none', fontWeight: 400 }, at).textContent = D.note.text
  }
  for (const n of D.nodes) {
    const h = NODE_H
    if (n.shape === 'diamond') box(at, { x: n.x + n.w * 0.15, y: n.y + n.d * 0.15, w: n.w * 0.7, d: n.d * 0.7, z: n.z, h, rot: 45 })
    else if (n.shape === 'circle') box(at, { ...n, h, radius: '50%', rings: 3 })
    else if (n.shape === 'cyl') box(at, { ...n, h, radius: '50%', rings: 4 })
    else box(at, { ...n, h })
    el('lab', { left: px(n.x), top: px(n.y), width: px(n.w), height: px(n.d), transform: `translateZ(${n.z + h + 1}px)` }, at).textContent = n.id
  }
}

let diagram = 'flow', view = 'iso'
function place() {
  const v = document.getElementById('view'), w = document.getElementById('world'), D = DIAGRAMS[diagram]
  const fit = Math.min(v.clientWidth / (D.W + 60), v.clientHeight / (D.H + 60))
  v.classList.toggle('p3d', view === '3d')
  const cx = -(D.W / 2), cy = -(D.H / 2)
  // the plane's diagram corner sits at PAD; centre the diagram, not the plane
  const centre = `translate(${0}px, ${0}px)`
  w.style.transform = view === 'flat' ? `scale(${fit})`
    : view === 'iso' ? `scale(${fit * 0.82}) rotateX(54.7deg) rotateZ(-45deg)`
    : `translateY(40px) scale(${fit * 0.95}) rotateX(58deg) rotateZ(-26deg)`
}
document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { diagram = b.dataset.d; document.querySelectorAll('[data-d]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(diagram); place() })
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { view = b.dataset.v; document.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', x === b)); place() })
document.querySelectorAll('[data-c]').forEach(c => c.onchange = () => document.body.classList.toggle(c.dataset.c, c.checked))
// grid: one square per world unit; with the extra, a heavier line every 5
const style = document.createElement('style')
style.textContent = `.plane{background-size:${G}px ${G}px} body.major .plane{background-size:${G * 5}px ${G * 5}px,${G * 5}px ${G * 5}px,${G}px ${G}px,${G}px ${G}px}`
document.head.appendChild(style)
addEventListener('resize', place)
draw(diagram); place()
</script>
</body>
</html>
