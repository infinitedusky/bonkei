<!doctype html>
<html><head><meta charset="utf-8"><title>merman · themes sketch</title>
<style>
  :root{--bar:#1a2030;--bar-b:#3a4560;--bar-t:#fff;--on:#4b6bdc;--muted:#9aa6c0;--pop:#151a26;--pop-t:#cfd8ea}
  body.light{--bar:#ffffffd9;--bar-b:#d5dae3;--bar-t:#1f2430;--on:#1f2430;--muted:#6b7385;--pop:#ffffff;--pop-t:#1f2430}
  html,body{margin:0;height:100%;font:13px Inter,system-ui,sans-serif;color:var(--muted);overflow:hidden}
  #scene{position:absolute;inset:0}
  #scene svg{width:100%;height:100%;display:block}
  .bar{position:absolute;top:12px;left:12px;display:flex;gap:6px;align-items:center;z-index:2}
  .b{padding:6px 12px;border:1px solid var(--bar-b);background:var(--bar);color:var(--bar-t);border-radius:7px;cursor:pointer;font:inherit;text-decoration:none;backdrop-filter:blur(8px)}
  .b.on{background:var(--on);color:#fff;border-color:var(--on)}
  .pop{position:absolute;top:50px;left:300px;z-index:3;background:var(--pop);border:1px solid var(--bar-b);border-radius:12px;padding:14px;width:980px;box-shadow:0 20px 50px #0005}
  .pop h4{margin:0 0 10px;color:var(--pop-t);font-weight:600;font-size:13px}
  .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .card{border:2px solid transparent;outline:1px solid var(--bar-b);border-radius:9px;overflow:hidden;text-decoration:none;color:var(--pop-t)}
  .card.on{border-color:#4b6bdc;outline-color:#4b6bdc}
  .card .th{height:104px}
  .card .th svg{width:100%;height:100%;display:block}
  .card .nm{padding:7px 9px 2px;font-weight:600}
  .card .ds{padding:0 9px 9px;font-size:11px;color:var(--muted);line-height:1.35}
  .pop .row{margin-top:12px;display:flex;gap:18px;font-size:12px;color:var(--muted);align-items:center}
  .seg{display:inline-flex;border:1px solid var(--bar-b);border-radius:6px;overflow:hidden}
  .seg span{padding:3px 9px}.seg span.on{background:var(--on);color:#fff}
  .note{position:absolute;right:12px;top:12px;z-index:2;max-width:330px;background:#fffbe6;color:#3a3220;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.45;box-shadow:0 4px 14px #0004}
  .note b{display:block;margin-bottom:4px}
  .hint{position:absolute;bottom:12px;left:12px;font-size:11px;z-index:2;opacity:.7}
  .tb{position:absolute;right:16px;bottom:16px;z-index:2;border:1.5px solid #cfe8ff;color:#e6f3ff;font:11px "JetBrains Mono",ui-monospace,Menlo,monospace;display:grid;grid-template-columns:auto auto;min-width:330px}
  .tb div{padding:5px 9px;border:0.5px solid #cfe8ff88}.tb .k{color:#8fb8e6;font-size:9px;letter-spacing:.08em}
  .tb .t{grid-column:1/3;font-size:14px;letter-spacing:.12em}
  .legend{position:absolute;left:16px;bottom:40px;z-index:2;display:flex;gap:14px;font-size:12px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .flow{animation:dash 1.1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
</style></head>
<body>
<div id="scene"></div>
<div class="bar">
  <button class="b">flat</button><button class="b on">iso</button><button class="b">3d</button>
  <span style="width:8px"></span>
  <button class="b">labels: top</button><button class="b">fit / relayout</button>
  <a class="b" id="themeBtn" href="#">◐ <span id="themeName"></span> ▾</a>
  <select class="b"><option>large</option></select>
  <button class="b">source</button><span>ELK 41ms</span>
</div>
<div class="pop" id="pop">
  <h4>Theme</h4>
  <div class="cards" id="cards"></div>
  <div class="row">
    <span>colour by <span class="seg"><span class="on">subgraph</span><span>shape</span><span>none</span></span></span>
    <label><input type="checkbox" checked> show flow on edges</label>
    <label><input type="checkbox"> save in diagram (<code>%%{theme: studio}%%</code>)</label>
  </div>
</div>
<div class="legend" id="legend"></div>
<div class="hint">drag node · drag bg pan (3d: orbit) · wheel zoom · click tray to fly in</div>
<div id="overlay"></div>
<div class="note" id="note"></div>

<script>
const THEME = 'night'
const PICKER_OPEN = false

const THEMES = {
  classic: { name: 'Classic', desc: 'Today’s look. Shapes coloured by kind.', file: 'theme-picker.html',
    note: '<b>Sketch: the theme picker</b>Made-up diagram. The toolbar gets a theme button, and each card previews this same diagram in that theme. <i>Colour by subgraph</i> is the new default in every theme: you read the system by its domains, not by shape kind. A theme changes the scene and the toolbar’s light or dark tone, never the layout.' },
  studio: { name: 'Studio', desc: 'Matte white clay, soft shadows. For decks.', file: 'theme-studio.html',
    note: '<b>Sketch: Studio</b>Made-up diagram. A product-render look: matte white slabs on a soft grey floor, real soft shadows, and nodes with white tops and sides in their domain colour. It sits quietly on a slide, and the colour only marks ownership.' },
  blueprint: { name: 'Blueprint', desc: 'Engineering sheet: wireframe, dimensions.', file: 'theme-blueprint.html',
    note: '<b>Sketch: Blueprint</b>Made-up diagram. An engineering drawing: wireframe solids with their hidden bottoms dashed, a fine and a major grid, dimension lines on each subgraph, monospace labels with an id code (SVC-03), and a title block. For design reviews and RFCs.' },
  night: { name: 'Night', desc: 'Ops-room dark, glowing flow on edges.', file: 'theme-night.html',
    note: '<b>Sketch: Night</b>Made-up diagram. Dark glass: subgraphs are glass trays with a glowing rim in their domain colour, nodes are dark bodies with lit edges, and traffic flows along the edges as moving dashes. For walking through a request live, and for big screens.' },
  map: { name: 'Map', desc: 'Isoflow-style: icons, zone floors, callouts.', file: 'theme-map.html',
    note: '<b>Sketch: Map</b>Made-up diagram, after your Isoflow reference. Nodes are outlined iso icons (server, switch, disk stack, person, policy check), standing in for Mermaid’s <code>@{ icon: … }</code>. Subgraphs are flat coloured zone floors named in big ground type. Every node has an upright callout card (name, then detail) on a dotted leader. Edges are thick navy with arrows mid-segment; secondary links are dotted, and long-haul links are dashed arcs.' },
  editorial: { name: 'Editorial', desc: 'Layered pastel platforms, crisp ink.', file: 'theme-editorial.html',
    note: '<b>Sketch: Editorial</b>Made-up diagram. The polished-docs look (think Stripe’s or the Economist’s iso figures): thick pastel platforms with gradient tops, floating subgraph chips, indigo ink edges with a dot where they start, and soft long shadows. For docs, blog posts and the README.' },
}

// ---------- the made-up diagram ----------
const TRAYS = [
  { id: 'orders', label: 'Orders', x0: 7, y0: 0, x1: 21, y1: 5 },
  { id: 'payments', label: 'Payments', x0: 7, y0: 7, x1: 21, y1: 12 },
]
const NODES = [
  { id: 'browser', icon: 'person', sub: 'Web · mobile', code: 'EXT-01', label: 'Browser', shape: 'round', g: 'ext', cx: 1, cy: 6, w: 2, d: 1.4 },
  { id: 'gw', icon: 'switch', sub: 'Envoy · TLS', code: 'EDG-01', label: 'API Gateway', shape: 'rect', g: 'ext', cx: 4.5, cy: 6, w: 2.2, d: 1.4 },
  { id: 'oapi', icon: 'server', sub: 'Go · 3 pods', code: 'SVC-01', label: 'Order API', shape: 'rect', g: 'orders', cx: 9, cy: 2.5, w: 2.2, d: 1.4 },
  { id: 'valid', icon: 'check', sub: 'Policy', code: 'DEC-01', label: 'Valid?', shape: 'diamond', g: 'orders', cx: 12.5, cy: 2.5, w: 2, d: 2 },
  { id: 'osvc', icon: 'server', sub: 'Go · 2 pods', code: 'SVC-02', label: 'Order Svc', shape: 'rect', g: 'orders', cx: 15.5, cy: 1.5, w: 2.2, d: 1.4 },
  { id: 'reject', icon: 'server', sub: 'DLQ handler', code: 'SVC-03', label: 'Reject', shape: 'round', g: 'orders', cx: 16, cy: 3.9, w: 1.8, d: 1.1 },
  { id: 'queue', icon: 'disks', sub: 'Kafka · 6 partitions', code: 'DAT-01', label: 'Order Queue', shape: 'cylinder', g: 'orders', cx: 19, cy: 1.5, w: 1.6, d: 1.6 },
  { id: 'papi', icon: 'server', sub: 'Node · 3 pods', code: 'SVC-04', label: 'Payment API', shape: 'rect', g: 'payments', cx: 9, cy: 9.5, w: 2.2, d: 1.4 },
  { id: 'fraud', icon: 'check', sub: 'ML score', code: 'DEC-02', label: 'Fraud?', shape: 'diamond', g: 'payments', cx: 12.5, cy: 9.5, w: 2, d: 2 },
  { id: 'charge', icon: 'server', sub: 'Stripe adapter', code: 'SVC-05', label: 'Charge Card', shape: 'rect', g: 'payments', cx: 16, cy: 9.5, w: 2.2, d: 1.4 },
  { id: 'ledger', icon: 'disks', sub: 'Postgres · HA', code: 'DAT-02', label: 'Ledger', shape: 'cylinder', g: 'payments', cx: 19, cy: 9.5, w: 1.6, d: 1.6 },
]
const EDGES = [
  { pts: [[2, 6], [3.4, 6]], label: 'HTTPS', g: 'ext' },
  { pts: [[5.6, 6], [6.3, 6], [6.3, 2.5], [7.9, 2.5]], g: 'orders' },
  { pts: [[5.6, 6], [6.3, 6], [6.3, 9.5], [7.9, 9.5]], g: 'payments' },
  { pts: [[10.1, 2.5], [11.5, 2.5]], g: 'orders' },
  { pts: [[13.5, 2.5], [14, 2.5], [14, 1.5], [14.4, 1.5]], label: 'yes', g: 'orders' },
  { pts: [[12.5, 3.5], [12.5, 3.9], [15.1, 3.9]], label: 'no', g: 'orders', dotted: true },
  { pts: [[16.6, 1.5], [18.2, 1.5]], g: 'orders' },
  { pts: [[10.1, 9.5], [11.5, 9.5]], g: 'payments' },
  { pts: [[13.5, 9.5], [14.9, 9.5]], label: 'ok', g: 'payments' },
  { pts: [[17.1, 9.5], [18.2, 9.5]], g: 'payments' },
]
const GROUP_NAME = { ext: 'Edge', orders: 'Orders', payments: 'Payments' }

// ---------- iso drawing ----------
const C = Math.cos(Math.PI / 6), SN = 0.5, U = 36
let out, late, mini, uid = 0, TRAY_TOP = 0.25
const id = n => n + uid
const P = (x, y, z) => [(x - y) * C * U, (x + y) * SN * U - z * U]
const pts = a => a.map(p => P(...p).map(v => v.toFixed(1)).join(',')).join(' ')
const poly = (a, fill, extra = '') => out.push(`<polygon points="${pts(a)}" fill="${fill}" stroke="${fill.startsWith('url') ? 'none' : fill}" stroke-width=".6" stroke-linejoin="round" ${extra}/>`)
const polyS = (a, fill, stroke, sw = 1, extra = '') => out.push(`<polygon points="${pts(a)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" ${extra}/>`)
const ln = (a, b) => `x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"`
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16)
  const f = v => Math.max(0, Math.min(255, Math.round(k > 1 ? v + (255 - v) * (k - 1) : v * k))).toString(16).padStart(2, '0')
  return '#' + f(n >> 16) + f((n >> 8) & 255) + f(n & 255)
}
const inTray = (x, y) => TRAYS.some(t => x >= t.x0 && x <= t.x1 && y >= t.y0 && y <= t.y1)
const groundZ = (x, y) => inTray(x, y) ? TRAY_TOP : 0

function rectPlan(cx, cy, w, d, r = 0.1) {
  const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - d / 2, y1 = cy + d / 2, a = []
  const arc = (ox, oy, s) => { for (let i = 0; i <= 4; i++) { const t = s + i / 4 * Math.PI / 2; a.push([ox + r * Math.cos(t), oy + r * Math.sin(t)]) } }
  arc(x1 - r, y0 + r, -Math.PI / 2); arc(x1 - r, y1 - r, 0); arc(x0 + r, y1 - r, Math.PI / 2); arc(x0 + r, y0 + r, Math.PI)
  return a
}
const circlePlan = (cx, cy, rx, ry, n = 40) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(i / n * 2 * Math.PI), cy + ry * Math.sin(i / n * 2 * Math.PI)])
const diamondPlan = (cx, cy, w, d) => [[cx, cy - d / 2], [cx + w / 2, cy], [cx, cy + d / 2], [cx - w / 2, cy]]
const planOf = n => n.shape === 'cylinder' ? circlePlan(n.cx, n.cy, n.w / 2, n.d / 2) : n.shape === 'diamond' ? diamondPlan(n.cx, n.cy, n.w, n.d) : rectPlan(n.cx, n.cy, n.w, n.d, n.shape === 'round' ? Math.min(n.w, n.d) / 2 * 0.95 : 0.12)
const trayPlan = (t, r = 0.08) => rectPlan((t.x0 + t.x1) / 2, (t.y0 + t.y1) / 2, t.x1 - t.x0, t.y1 - t.y0, r)

// solid extrusion: sides lit by facing, top fill (colour or url)
function extrude(plan, z0, z1, side, top, o = {}) {
  const n = plan.length; let area = 0
  for (let i = 0; i < n; i++) { const [a, b] = plan[i], [c, d] = plan[(i + 1) % n]; area += a * d - c * b }
  const sg = area > 0 ? 1 : -1, faces = []
  for (let i = 0; i < n; i++) {
    const [a, b] = plan[i], [c, d] = plan[(i + 1) % n]
    let nx = (d - b) * sg, ny = -(c - a) * sg
    if (nx + ny <= 1e-9) continue
    ny /= Math.hypot(nx, ny)
    faces.push({ k: a + b + c + d, q: [[a, b, z0], [c, d, z0], [c, d, z1], [a, b, z1]], f: shade(side, (o.lo ?? 0.72) + (o.span ?? 0.22) * ny) })
  }
  const smooth = plan.length > 20
  faces.sort((p, q) => p.k - q.k).forEach(f => o.ol && !smooth ? polyS(f.q, f.f, o.ol, o.olw || 0.9) : poly(f.q, f.f))
  if (o.ol && smooth) {
    // round solids: outline the silhouette only, not every facet
    const sx = plan.map(([x, y]) => P(x, y, 0)[0])
    for (const i of [sx.indexOf(Math.min(...sx)), sx.indexOf(Math.max(...sx))]) out.push(`<line ${ln(P(...plan[i], z0), P(...plan[i], z1))} stroke="${o.ol}" stroke-width="${o.olw || 0.9}"/>`)
    frontEdges(plan).forEach(([p, q]) => out.push(`<line ${ln(P(...p, z0), P(...q, z0))} stroke="${o.ol}" stroke-width="${o.olw || 0.9}"/>`))
  }
  if (top !== null) o.ol ? polyS(plan.map(([x, y]) => [x, y, z1]), top ?? side, o.ol, o.olw || 0.9) : poly(plan.map(([x, y]) => [x, y, z1]), top ?? side)
  if (o.rim) polyS(plan.map(([x, y]) => [x, y, z1]), 'none', o.rim, o.rimW || 1, o.rimExtra || '')
}
// wireframe: hidden bottom dashed, silhouette + front verticals solid
function wire(plan, z0, z1, col, fill = 'none') {
  polyS(plan.map(([x, y]) => [x, y, z0]), 'none', col, 0.8, 'stroke-dasharray="3 3" opacity=".5"')
  const sx = plan.map(([x, y]) => P(x, y, 0)[0]), depth = plan.map(([x, y]) => x + y)
  const idx = new Set([sx.indexOf(Math.min(...sx)), sx.indexOf(Math.max(...sx)), depth.indexOf(Math.max(...depth))])
  for (const i of idx) out.push(`<line ${ln(P(...plan[i], z0), P(...plan[i], z1))} stroke="${col}" stroke-width="1.1"/>`)
  frontEdges(plan).forEach(([p, q]) => out.push(`<line ${ln(P(...p, z0), P(...q, z0))} stroke="${col}" stroke-width="1.1"/>`))
  polyS(plan.map(([x, y]) => [x, y, z1]), fill, col, 1.2)
}
function frontEdges(plan) { const n = plan.length; let area = 0; for (let i = 0; i < n; i++) { const [a, b] = plan[i], [c, d] = plan[(i + 1) % n]; area += a * d - c * b } const sg = area > 0 ? 1 : -1, r = []; for (let i = 0; i < n; i++) { const [a, b] = plan[i], [c, d] = plan[(i + 1) % n]; if (((d - b) - (c - a)) * sg > 1e-9) r.push([plan[i], plan[(i + 1) % n]]) } return r }

// decisions: a short prism with a cut, gem-like top, so they read as decisions in iso
function frustum(bot, top, z0, z1, side, topFill, o = {}) {
  const n = bot.length, faces = []
  for (let i = 0; i < n; i++) {
    const [a, b] = bot[i], [c, d] = bot[(i + 1) % n]
    let nx = (d - b), ny = -(c - a); if (nx + ny <= 1e-9) continue
    ny /= Math.hypot(nx, ny)
    faces.push({ k: a + b + c + d, q: [[a, b, z0], [c, d, z0], [...top[(i + 1) % n], z1], [...top[i], z1]], f: shade(side, (o.lo ?? 0.72) + 0.12 + (o.span ?? 0.22) * ny) })
  }
  faces.sort((p, q) => p.k - q.k).forEach(f => poly(f.q, f.f))
  poly(top.map(([x, y]) => [x, y, z1]), topFill)
  if (o.rim) polyS(top.map(([x, y]) => [x, y, z1]), 'none', o.rim, o.rimW || 1, o.rimExtra || '')
}
// in iso a diamond (a square turned 45°) reads as a flat card, so decisions draw as hexagonal prisms
const hexPlan = n => Array.from({ length: 6 }, (_, i) => { const a = Math.PI / 12 + i * Math.PI / 3; return [n.cx + n.w / 2 * Math.cos(a), n.cy + n.d / 2 * Math.sin(a)] })
function solid(n, z, h, side, top, o = {}) {
  return extrude(n.shape === 'diamond' ? hexPlan(n) : planOf(n), z, z + h, side, top, o)
}
function wireNode(n, z, h, col, fill) {
  return wire(n.shape === 'diamond' ? hexPlan(n) : planOf(n), z, z + h, col, fill)
}

function checkerGrid(t, z, col, step = 1, sw = 0.6, op = 1) {
  for (let x = t.x0 + step; x < t.x1 - 1e-6; x += step) out.push(`<line ${ln(P(x, t.y0, z), P(x, t.y1, z))} stroke="${col}" stroke-width="${sw}" opacity="${op}"/>`)
  for (let y = t.y0 + step; y < t.y1 - 1e-6; y += step) out.push(`<line ${ln(P(t.x0, y, z), P(t.x1, y, z))} stroke="${col}" stroke-width="${sw}" opacity="${op}"/>`)
}
function softShadow(plan, z, dx, dy, op, blur) { poly(plan.map(([x, y]) => [x + dx, y + dy, z + 0.001]), `rgba(20,28,50,${op})`, `filter="url(#${id('blur' + blur)})"`) }
function topLabel(x, y, z, text, o = {}) {
  if (mini) return
  const [X, Y] = P(x, y, z)
  out.push(`<text transform="matrix(${C},${SN},${-C},${SN},${X.toFixed(1)},${Y.toFixed(1)})" font-family="${o.font || 'Inter,system-ui,sans-serif'}" font-size="${o.size || 12}" font-weight="${o.weight || 600}" fill="${o.color || '#fff'}" text-anchor="${o.anchor || 'middle'}" dominant-baseline="middle" letter-spacing="${o.ls || 0}">${text}</text>`)
}
function edgeScreen(e) { return e.pts.map(([x, y]) => P(x, y, groundZ(x, y) + 0.03)) }
const pathD = s => 'M' + s.map(p => p.map(v => v.toFixed(1)).join(',')).join(' L')
function arrow(e, col, size = 5) {
  const s = edgeScreen(e), [ax, ay] = s[s.length - 2], [bx, by] = s[s.length - 1]
  const L = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / L, uy = (by - ay) / L
  out.push(`<polygon points="${bx},${by} ${bx - ux * size * 1.8 - uy * size * 0.75},${by - uy * size * 1.8 + ux * size * 0.75} ${bx - ux * size * 1.8 + uy * size * 0.75},${by - uy * size * 1.8 - ux * size * 0.75}" fill="${col}"/>`)
}
function edgeMid(e) {
  let best = 0, bi = 0
  for (let i = 0; i < e.pts.length - 1; i++) { const l = Math.hypot(e.pts[i + 1][0] - e.pts[i][0], e.pts[i + 1][1] - e.pts[i][1]); if (l > best) { best = l; bi = i } }
  const [a, b] = [e.pts[bi], e.pts[bi + 1]], x = (a[0] + b[0]) / 2, y = (a[1] + b[1]) / 2
  return P(x, y, groundZ(x, y))
}
function pill(X, Y, text, o) {
  if (mini) return
  const w = text.length * (o.size || 10) * 0.62 + 16, h = (o.size || 10) + 10
  late.push(`<rect x="${X - w / 2}" y="${Y - h / 2}" width="${w}" height="${h}" rx="${o.r ?? h / 2}" fill="${o.bg}" stroke="${o.border || 'none'}" stroke-width="1" ${o.extra || ''}/>`)
  late.push(`<text x="${X}" y="${Y + 0.5}" font-family="${o.font || 'Inter,system-ui,sans-serif'}" font-size="${o.size || 10}" font-weight="${o.weight || 600}" fill="${o.color}" text-anchor="middle" dominant-baseline="middle" letter-spacing="${o.ls || 0}">${text}</text>`)
}

const COMMON_DEFS = () => `<filter id="${id('blur3')}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="${id('blur8')}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="${id('glow')}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`

// ---------- themes ----------
const DRAW = {
  classic: {
    ui: 'dark', bg: '#0f1218', trayH: 0.25,
    ground() { for (let i = -4; i <= 25; i++) out.push(`<line ${ln(P(i, -4, 0), P(i, 16, 0))} stroke="#1a2130"/>`); for (let j = -4; j <= 16; j++) out.push(`<line ${ln(P(-4, j, 0), P(25, j, 0))} stroke="#1a2130"/>`) },
    tray(t) { extrude(trayPlan(t, 0.05), 0, TRAY_TOP, '#243044'); topLabel(t.x0 + 0.3, t.y0 + 0.5, TRAY_TOP + 0.01, t.label, { size: 14, color: '#cfd8ea', anchor: 'start' }) },
    edge(e) { out.push(`<path d="${pathD(edgeScreen(e))}" fill="none" stroke="#e8edf7" stroke-width="2"/>`); arrow(e, '#e8edf7'); if (e.label && !mini) { const [X, Y] = edgeMid(e); late.push(`<text x="${X}" y="${Y - 12}" font-size="11" font-weight="700" fill="#ffd479" text-anchor="middle" stroke="#000" stroke-width="3" paint-order="stroke">${e.label}</text>`) } },
    node(n, z) { const col = { rect: '#5b8def', round: '#3fbf9b', cylinder: '#e0a458', diamond: '#d96c8a' }[n.shape]; extrude(planOf(n), z, z + 0.7, col, col, { lo: 0.6 }); topLabel(n.cx, n.cy, z + 0.71, n.label) },
  },

  studio: {
    ui: 'light', bg: '#eceef2', trayH: 0.35,
    G: { ext: '#8b93a7', orders: '#4f7cff', payments: '#12b886' },
    defs() { return `<radialGradient id="${id('floor')}" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#dfe2e8"/></radialGradient>` },
    ground() { out.push(`<rect x="-5000" y="-5000" width="10000" height="10000" fill="url(#${id('floor')})"/>`) },
    tray(t) {
      softShadow(trayPlan(t, 0.12), 0, -0.25, 0.45, 0.22, 8)
      extrude(trayPlan(t, 0.12), 0, TRAY_TOP, '#e9ebf0', '#ffffff', { lo: 0.86, span: 0.1 })
      topLabel(t.x0 + 0.35, t.y0 + 0.55, TRAY_TOP + 0.01, t.label.toUpperCase(), { size: 11, color: shade(this.G[t.id], 0.8), weight: 700, anchor: 'start', ls: 1.5 })
      topLabel(t.x0 + 0.35, t.y0 + 1.0, TRAY_TOP + 0.01, NODES.filter(n => n.g === t.id).length + ' components', { size: 9, color: '#9aa1b0', weight: 500, anchor: 'start' })
    },
    edge(e) { out.push(`<path d="${pathD(edgeScreen(e))}" fill="none" stroke="#2b3140" stroke-width="1.4" stroke-linejoin="round"/>`); arrow(e, '#2b3140', 4); if (e.label) { const [X, Y] = edgeMid(e); pill(X, Y - 10, e.label, { bg: '#fff', color: '#2b3140', border: '#d5dae3', size: 9 }) } },
    node(n, z) {
      const col = this.G[n.g], plan = planOf(n)
      softShadow(plan, z, -0.12, 0.22, 0.28, 3)
      solid(n, z, 0.6, col, '#ffffff', { lo: 0.78, span: 0.25 })
      topLabel(n.cx, n.cy, z + 0.61, n.label, { size: n.shape === 'diamond' ? 10 : 11, color: '#1f2430' })
    },
    legend: true,
  },

  blueprint: {
    ui: 'dark', bg: '#0b3a6e', trayH: 0.25, INK: '#d6ecff',
    ground() {
      for (let i = -6; i <= 27; i++) out.push(`<line ${ln(P(i, -6, 0), P(i, 18, 0))} stroke="${i % 5 ? '#164a85' : '#2a64a6'}" stroke-width="${i % 5 ? .6 : 1}"/>`)
      for (let j = -6; j <= 18; j++) out.push(`<line ${ln(P(-6, j, 0), P(27, j, 0))} stroke="${j % 5 ? '#164a85' : '#2a64a6'}" stroke-width="${j % 5 ? .6 : 1}"/>`)
    },
    tray(t) {
      const I = this.INK
      wire(trayPlan(t, 0.01), 0, TRAY_TOP, I, 'rgba(160,210,255,0.05)')
      topLabel(t.x0 + 0.3, t.y0 + 0.5, TRAY_TOP + 0.01, t.label.toUpperCase() + ' / BOUNDED CONTEXT', { size: 10, color: I, anchor: 'start', font: 'JetBrains Mono,ui-monospace,Menlo,monospace', ls: 1.5, weight: 500 })
      // dimension line along the front edge
      const y = t.y1 + 0.7, z = 0
      out.push(`<line ${ln(P(t.x0, y, z), P(t.x1, y, z))} stroke="${I}" stroke-width=".8"/>`)
      for (const x of [t.x0, t.x1]) { out.push(`<line ${ln(P(x, t.y1 + 0.2, z), P(x, y + 0.25, z))} stroke="${I}" stroke-width=".8"/>`); out.push(`<line ${ln(P(x - .12, y - .12, z), P(x + .12, y + .12, z))} stroke="${I}" stroke-width="1.2"/>`) }
      topLabel((t.x0 + t.x1) / 2, y - 0.25, z, `${NODES.filter(n => n.g === t.id).length} COMPONENTS · ${EDGES.filter(e => e.g === t.id).length} FLOWS`, { size: 9, color: I, font: 'JetBrains Mono,ui-monospace,Menlo,monospace', weight: 400, ls: 1 })
    },
    edge(e) { const I = this.INK; out.push(`<path d="${pathD(edgeScreen(e))}" fill="none" stroke="#ffffff" stroke-width="1.1"/>`); arrow(e, '#fff', 4); if (e.label) { const [X, Y] = edgeMid(e); pill(X, Y - 2, e.label.toUpperCase(), { bg: '#0b3a6e', color: I, border: I, size: 8, r: 0, font: 'JetBrains Mono,ui-monospace,Menlo,monospace', ls: 1 }) } },
    node(n, z) {
      const I = this.INK
      wireNode(n, z, 0.7, I, 'rgba(160,210,255,0.10)')
      topLabel(n.cx, n.cy - 0.12, z + 0.71, n.label.toUpperCase(), { size: 9, color: '#fff', font: 'JetBrains Mono,ui-monospace,Menlo,monospace', weight: 600, ls: 0.5 })
      topLabel(n.cx, n.cy + 0.28, z + 0.71, n.code, { size: 8, color: '#8fc3f5', font: 'JetBrains Mono,ui-monospace,Menlo,monospace', weight: 400, ls: 1 })
    },
    overlay: `<div class="tb"><div class="t" style="grid-column:1/3">CHECKOUT PLATFORM</div><div><span class="k">DRAWN</span><br>merman</div><div><span class="k">REV</span><br>3 · 2026-11-13</div><div><span class="k">SOURCE</span><br>large.mmd</div><div><span class="k">SHEET</span><br>1 / 1 · ISO</div></div>`,
  },

  night: {
    ui: 'dark', bg: '#05070d', trayH: 0.2,
    G: { ext: '#93a8d6', orders: '#22d3ee', payments: '#f472b6' },
    defs() { return `<radialGradient id="${id('nbg')}" cx="55%" cy="45%" r="70%"><stop offset="0" stop-color="#0d1426"/><stop offset="1" stop-color="#03040a"/></radialGradient>` },
    ground() {
      out.push(`<rect x="-5000" y="-5000" width="10000" height="10000" fill="url(#${id('nbg')})"/>`)
      if (!mini) for (let i = -4; i <= 25; i++) for (let j = -4; j <= 16; j++) { const [X, Y] = P(i, j, 0); out.push(`<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r=".8" fill="#2a3656"/>`) }
    },
    tray(t) {
      const c = this.G[t.id], plan = trayPlan(t, 0.15)
      extrude(plan, 0, TRAY_TOP, '#0b1120', `${c}14`, { lo: 0.9, span: 0.1 })
      polyS(plan.map(([x, y]) => [x, y, TRAY_TOP]), 'none', c, 1.2, `filter="url(#${id('glow')})" opacity=".85"`)
      topLabel(t.x0 + 0.35, t.y0 + 0.55, TRAY_TOP + 0.01, t.label.toUpperCase(), { size: 11, color: c, weight: 700, anchor: 'start', ls: 2 })
      topLabel(t.x0 + 0.35, t.y0 + 1.0, TRAY_TOP + 0.01, 'p99 142ms · 1.2k rps', { size: 9, color: '#6b7a9c', weight: 500, anchor: 'start', font: 'JetBrains Mono,ui-monospace,monospace' })
    },
    edge(e) {
      const c = this.G[e.g], d = pathD(edgeScreen(e))
      out.push(`<path d="${d}" fill="none" stroke="${c}" stroke-width="1.2" opacity=".35"/>`)
      out.push(`<path class="flow" d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="3 13" stroke-linecap="round" filter="url(#${id('glow')})"/>`)
      arrow(e, c, 4)
      if (e.label) { const [X, Y] = edgeMid(e); pill(X, Y - 2, e.label, { bg: '#0b1120', color: c, border: c + '88', size: 9, font: 'JetBrains Mono,ui-monospace,monospace' }) }
    },
    node(n, z) {
      const c = this.G[n.g], plan = planOf(n)
      solid(n, z, 0.6, '#1a2338', '#0e1526', { lo: 0.55, span: 0.35, rim: c, rimW: 1.4, rimExtra: `filter="url(#${id('glow')})"` })
      topLabel(n.cx, n.cy - 0.1, z + 0.61, n.label, { size: 11, color: '#e8f1ff' })
      topLabel(n.cx, n.cy + 0.3, z + 0.61, n.shape === 'cylinder' ? '● healthy' : '● 3 pods', { size: 8, color: c, weight: 500, font: 'JetBrains Mono,ui-monospace,monospace' })
    },
    legend: true,
  },

  editorial: {
    ui: 'light', bg: '#f6f9fc', trayH: 0.55,
    G: { ext: '#8792a2', orders: '#635bff', payments: '#0bb5a0' },
    T: { orders: ['#eef0ff', '#d9dcff'], payments: ['#e3fbf6', '#c3f2e7'] },
    defs() {
      return Object.entries(this.T).map(([k, [a, b]]) => `<linearGradient id="${id('tg' + k)}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`).join('') +
        Object.entries(this.G).map(([k, c]) => `<linearGradient id="${id('ng' + k)}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="${shade(c, 1.82)}"/></linearGradient>`).join('')
    },
    ground() { },
    tray(t) {
      const plan = trayPlan(t, 0.3)
      softShadow(plan, -0.0, -0.9, 0.9, 0.12, 8)
      extrude(plan, 0, TRAY_TOP, shade(this.G[t.id], 1.45), `url(#${id('tg' + t.id)})`, { lo: 0.78, span: 0.2 })
      if (!mini) { const [X, Y] = P(t.x0 + 1.3, t.y0 + 0.5, TRAY_TOP + 0.35); pill(X, Y, '● ' + t.label, { bg: '#fff', color: this.G[t.id], size: 11, weight: 600, extra: 'filter="drop-shadow(0 4px 10px rgba(10,37,64,.15))"' }) }
    },
    edge(e) {
      const c = this.G[e.g] === this.G.ext ? '#0a2540' : this.G[e.g], s = edgeScreen(e)
      out.push(`<path d="${pathD(s)}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`)
      out.push(`<circle cx="${s[0][0]}" cy="${s[0][1]}" r="3" fill="#fff" stroke="${c}" stroke-width="1.6"/>`)
      arrow(e, c, 4.5)
      if (e.label) { const [X, Y] = edgeMid(e); pill(X, Y - 2, e.label, { bg: c, color: '#fff', size: 9 }) }
    },
    node(n, z) {
      const col = this.G[n.g], plan = planOf(n)
      softShadow(plan, z, -0.35, 0.35, 0.18, 3)
      solid(n, z, 0.65, col, `url(#${id('ng' + n.g)})`, { lo: 0.7, span: 0.3 })
      topLabel(n.cx, n.cy, z + 0.66, n.label, { size: 11, color: '#0a2540' })
    },
  },
  map: {
    // after Isoflow: icons with outlines, flat zone floors named in big ground type, callout cards, mid-segment arrows
    ui: 'light', bg: '#f5f6f9', trayH: 0.08, INK: '#1f2330', LINE: '#1d36a6', OL: '#2a2f3a',
    Z: { orders: '#6fae45', payments: '#f0a43c' },
    ground() {
      for (let i = -6; i <= 27; i++) out.push(`<line ${ln(P(i, -6, 0), P(i, 18, 0))} stroke="#e1e4ea" stroke-width=".8"/>`)
      for (let j = -6; j <= 18; j++) out.push(`<line ${ln(P(-6, j, 0), P(27, j, 0))} stroke="#e1e4ea" stroke-width=".8"/>`)
    },
    tray(t) {
      const c = this.Z[t.id]
      extrude(trayPlan(t, 0.5), 0, TRAY_TOP, shade(c, 0.85), c, { lo: 0.75, span: 0.15 })
      topLabel(t.x0 + 0.1, t.y1 + 0.75, 0, t.label, { size: 30, weight: 800, color: this.INK, anchor: 'start', ls: -0.5 })
    },
    edge(e) {
      const s = edgeScreen(e), d = pathD(s), L = this.LINE
      out.push(`<path d="${d}" fill="none" stroke="${L}" stroke-width="${mini ? 2 : 4}" stroke-linejoin="miter" ${e.dotted ? 'stroke-dasharray="0.1 7" stroke-linecap="round"' : ''}/>`)
      if (mini) return
      for (let i = 0; i < s.length - 1; i++) {
        const [ax, ay] = s[i], [bx, by] = s[i + 1], l = Math.hypot(bx - ax, by - ay); if (l < 34) continue
        const ux = (bx - ax) / l, uy = (by - ay) / l, mx = (ax + bx) / 2 + ux * 6, my = (ay + by) / 2 + uy * 6, k = 7
        late.push(`<polygon points="${mx},${my} ${mx - ux * k * 1.8 - uy * k * .8},${my - uy * k * 1.8 + ux * k * .8} ${mx - ux * k * 1.8 + uy * k * .8},${my - uy * k * 1.8 - ux * k * .8}" fill="#111"/>`)
      }
      if (e.label) { const [X, Y] = edgeMid(e); pill(X, Y + 12, e.label, { bg: '#fff', color: '#333', border: '#cfd4dd', size: 9, r: 3 }) }
    },
    node(n, z) {
      const o = { ol: this.OL, lo: 0.78, span: 0.2 }, cx = n.cx, cy = n.cy
      let top = z + 1
      if (n.icon === 'server') {
        extrude(rectPlan(cx, cy, 1, 1, 0.01), z, z + 1, '#dfe3ec', '#f6f7fa', o)
        for (const h of [0.33, 0.66]) { out.push(`<line ${ln(P(cx - .5, cy + .5, z + h), P(cx + .5, cy + .5, z + h))} stroke="${this.OL}" stroke-width=".9"/>`); out.push(`<line ${ln(P(cx + .5, cy - .5, z + h), P(cx + .5, cy + .5, z + h))} stroke="${this.OL}" stroke-width=".9"/>`) }
        for (const h of [0.16, 0.49, 0.82]) { const [X, Y] = P(cx + .5, cy + .32, z + h); out.push(`<circle cx="${X}" cy="${Y}" r="1.6" fill="#34c759"/>`) }
      } else if (n.icon === 'switch') {
        extrude(rectPlan(cx, cy, 1.5, 0.8, 0.01), z, z + 0.3, '#dfe3ec', '#f6f7fa', o); top = z + 0.3
        for (let k = 0; k < 8; k++) { const x = cx - .62 + k * .16; poly([[x, cy + .4, z + .08], [x + .1, cy + .4, z + .08], [x + .1, cy + .4, z + .2], [x, cy + .4, z + .2]], '#2a2f3a') }
      } else if (n.icon === 'disks') {
        for (let k = 0; k < 3; k++) extrude(circlePlan(cx, cy, .55, .55), z + k * .27, z + k * .27 + .22, '#d6dbe5', '#eef0f5', o)
        top = z + 0.76
      } else if (n.icon === 'person') {
        extrude(circlePlan(cx, cy, .33, .33), z, z + .55, '#cfd5e2', '#e9ecf3', o)
        const [X, Y] = P(cx, cy, z + .85); out.push(`<circle cx="${X}" cy="${Y}" r="${mini ? 3 : 10}" fill="#e9ecf3" stroke="${this.OL}" stroke-width=".9"/>`)
        top = z + 1.05
      } else {
        extrude(hexPlan({ cx, cy, w: 1.3, d: 1.3 }), z, z + .45, '#d9534f', '#ec7a73', o); top = z + .45
        const [X, Y] = P(cx, cy, top); if (!mini) out.push(`<text x="${X}" y="${Y + 1}" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="middle">?</text>`)
      }
      if (mini) return
      const [X, Y] = P(cx, cy, top), cy0 = Y - 34, w = Math.max(n.label.length * 6.6, n.sub.length * 5.6) + 18, h = 32
      late.push(`<line x1="${X}" y1="${Y - 2}" x2="${X}" y2="${cy0}" stroke="#333" stroke-width="1.2" stroke-dasharray="1.5 3"/>`)
      late.push(`<rect x="${X - w / 2}" y="${cy0 - h}" width="${w}" height="${h}" rx="3" fill="#fff" stroke="#cfd4dd"/>`)
      late.push(`<text x="${X - w / 2 + 9}" y="${cy0 - h + 13}" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#1f2330">${n.label}</text>`)
      late.push(`<text x="${X - w / 2 + 9}" y="${cy0 - h + 26}" font-family="Inter,system-ui,sans-serif" font-size="9.5" fill="#5b6273">${n.sub}</text>`)
    },
    after() {
      // a long-haul link drawn as a dashed arc, like a tunnel or replication
      const a = P(19, 1.5, 0.9), b = P(1, 6, 1.2), c = [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - 260]
      out.push(`<path d="M${a} Q${c} ${b}" fill="none" stroke="#c8743a" stroke-width="${mini ? 2 : 5}" stroke-dasharray="${mini ? '4 4' : '12 9'}" stroke-linecap="round"/>`)
      if (!mini) { const m = [(a[0] + 2 * c[0] + b[0]) / 4, (a[1] + 2 * c[1] + b[1]) / 4]; pill(m[0], m[1], 'live updates · WebSocket', { bg: '#fff', color: '#555', border: '#cfd4dd', size: 9, r: 3 }) }
    },
  },
}

function render(theme, small = false) {
  out = []; late = []; mini = small; uid++
  const T = DRAW[theme]
  TRAY_TOP = T.trayH
  out.push(`<defs>${COMMON_DEFS()}${T.defs ? T.defs() : ''}</defs>`)
  T.ground()
  TRAYS.forEach(t => T.tray(t))
  EDGES.forEach(e => T.edge(e))
  NODES.slice().sort((a, b) => (a.cx + a.cy) - (b.cx + b.cy)).forEach(n => T.node(n, groundZ(n.cx, n.cy)))
  T.after && T.after()
  const [xa] = P(-2, 14, 0), [xb] = P(23, -1, 0), [, ya] = P(-1, -1, 2.5), [, yb] = P(22, 13, -1.5)
  const vb = `${(xa - 20).toFixed(0)} ${(ya - 20).toFixed(0)} ${(xb - xa + 40).toFixed(0)} ${(yb - ya + 40).toFixed(0)}`
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid ${small ? 'slice' : 'meet'}" style="background:${T.bg}">${out.join('')}${late.join('')}</svg>`
}

const T = DRAW[THEME]
document.getElementById('scene').innerHTML = render(THEME)
document.body.style.background = T.bg
if (T.ui === 'light') document.body.classList.add('light')
document.getElementById('themeName').textContent = THEMES[THEME].name
document.getElementById('note').innerHTML = THEMES[THEME].note
document.getElementById('overlay').innerHTML = T.overlay || ''
if (T.legend) document.getElementById('legend').innerHTML = Object.entries(T.G).map(([k, c]) => `<span><i style="background:${c}"></i>${GROUP_NAME[k]}</span>`).join('')
const pop = document.getElementById('pop')
pop.style.display = PICKER_OPEN ? 'block' : 'none'
if (PICKER_OPEN) Object.assign(document.getElementById('note').style, { top: 'auto', bottom: '12px' })
document.getElementById('themeBtn').onclick = e => { e.preventDefault(); pop.style.display = pop.style.display === 'none' ? 'block' : 'none' }
document.getElementById('cards').innerHTML = Object.keys(THEMES).map(k =>
  `<a class="card ${k === THEME ? 'on' : ''}" href="${THEMES[k].file}"><div class="th">${render(k, true)}</div><div class="nm">${THEMES[k].name}</div><div class="ds">${THEMES[k].desc}</div></a>`).join('')
</script>
</body></html>
