<!doctype html>
<html><head><meta charset="utf-8"><title>merman · theme system sketch</title>
<style>
  :root{--bar:#1a2030;--bar-b:#3a4560;--bar-t:#fff;--on:#4b6bdc;--muted:#9aa6c0;--pop:#151a26;--pop-t:#cfd8ea}
  body.light{--bar:#ffffffd9;--bar-b:#d5dae3;--bar-t:#1f2430;--on:#1f2430;--muted:#6b7385;--pop:#ffffff;--pop-t:#1f2430}
  html,body{margin:0;height:100%;font:13px Inter,system-ui,sans-serif;overflow:hidden;background:#0f1218}
  .b{padding:6px 12px;border:1px solid var(--bar-b);background:var(--bar);color:var(--bar-t);border-radius:7px;cursor:pointer;font:inherit;text-decoration:none;backdrop-filter:blur(8px)}
  .b.on{background:var(--on);color:#fff;border-color:var(--on)}
  svg{display:block}
  .flow{animation:dash 1.1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
  .note{position:absolute;z-index:5;max-width:340px;background:#fffbe6;color:#3a3220;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.45;box-shadow:0 4px 14px #0004}
  .note b{display:block;margin-bottom:4px}

  /* ---- editor ---- */
  #editor{display:grid;grid-template-columns:290px 1fr 360px;height:100%}
  .side{background:#12161f;color:#cfd8ea;overflow:auto;border-right:1px solid #232a3a}
  .side h3{margin:0;padding:14px 16px 6px;font-size:13px;color:#fff}
  .preset{display:flex;gap:6px;padding:4px 16px 12px;align-items:center}
  .preset select{flex:1;padding:6px;background:#1a2030;color:#fff;border:1px solid #3a4560;border-radius:6px;font:inherit}
  .edited{font-size:11px;color:#ffd479}
  .grp{border-top:1px solid #232a3a;padding:10px 16px}
  .grp h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a94ac}
  .ctl{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;margin:6px 0;font-size:12px}
  .ctl label{color:#9aa6c0}
  .ctl.chg label{color:#ffd479}
  .seg{display:inline-flex;flex-wrap:wrap;border:1px solid #3a4560;border-radius:6px;overflow:hidden}
  .seg span{padding:3px 7px;cursor:pointer;color:#cfd8ea;font-size:11px}.seg span.on{background:#4b6bdc;color:#fff}
  .ctl input[type=color]{width:42px;height:22px;border:1px solid #3a4560;background:none;padding:0;border-radius:4px}
  .ctl input[type=range]{width:100%}
  .stage{position:relative;overflow:hidden}
  .stage .bar{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}
  #preview{position:absolute;inset:0}#preview svg{width:100%;height:100%}
  .code{background:#0b0e14;color:#cfd8ea;overflow:auto;border-left:1px solid #232a3a;font:11.5px/1.55 "JetBrains Mono",ui-monospace,Menlo,monospace}
  .code h4{margin:0;padding:12px 14px 4px;font:600 11px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8a94ac}
  .code pre{margin:0;padding:4px 14px 12px;white-space:pre-wrap}
  .code .c{color:#6b7590}.code .k{color:#8fb8ff}.code .s{color:#a5e3a0}.code .chg{background:#ffd47922;color:#ffd479;display:inline-block;width:100%}
  .code .btns{display:flex;gap:6px;padding:0 14px 14px}
  .tb{position:absolute;right:16px;bottom:16px;z-index:2;border:1.5px solid #cfe8ff;color:#e6f3ff;font:11px "JetBrains Mono",ui-monospace,Menlo,monospace;display:grid;grid-template-columns:auto auto;min-width:300px}
  .tb div{padding:5px 9px;border:0.5px solid #cfe8ff88}.tb .k{color:#8fb8e6;font-size:9px;letter-spacing:.08em}.tb .t{grid-column:1/3;font-size:13px;letter-spacing:.12em}

  /* ---- picker (in the app) ---- */
  #app{position:absolute;inset:0}
  #app .scene{position:absolute;inset:0}#app .scene svg{width:100%;height:100%}
  #app .bar{position:absolute;top:12px;left:12px;display:flex;gap:6px;align-items:center;z-index:2;color:var(--muted)}
  .pop{position:absolute;top:50px;left:300px;z-index:3;background:var(--pop);border:1px solid var(--bar-b);border-radius:12px;padding:14px;width:980px;box-shadow:0 20px 50px #0005}
  .pop h4{margin:0 0 10px;color:var(--pop-t);font-weight:600;font-size:13px;display:flex;justify-content:space-between}
  .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .card{outline:1px solid var(--bar-b);border:2px solid transparent;border-radius:9px;overflow:hidden;color:var(--pop-t);cursor:pointer}
  .card.on{border-color:#4b6bdc;outline-color:#4b6bdc}
  .card .th{height:100px}.card .th svg{width:100%;height:100%}
  .card .nm{padding:7px 9px 9px;font-weight:600}
  .card.add{display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);border:2px dashed var(--bar-b);outline:none}
  .pop .row{margin-top:12px;display:flex;gap:16px;font-size:12px;color:var(--muted);align-items:center}
</style></head>
<body>
<script>
const MODE = 'picker'      // 'editor' | 'picker'
const START = 'map'

// =====================================================================================
// THE THEME: plain data. Every built-in is one of these; a custom theme is one of these
// (or a preset plus overrides). The renderer below reads only this object.
// =====================================================================================
const PRESETS = {
  classic: { name: 'Classic', colorBy: 'shape', ink: '#e8edf7',
    palette: { orders: '#5b8def', payments: '#3fbf9b', ext: '#8b93a7', rect: '#5b8def', round: '#3fbf9b', cylinder: '#e0a458', diamond: '#d96c8a' },
    scene: { background: '#0f1218', ground: 'grid', grid: '#1a2130', ui: 'dark' },
    zone: { style: 'slab', height: 0.25, radius: 0.05, fill: '#243044', shadow: 0, label: 'corner', labelColor: '#cfd8ea', sub: 'none' },

    label: { font: 'sans', case: 'none', placement: 'top', color: '#ffffff' } },
  studio: { name: 'Studio', colorBy: 'subgraph', ink: '#2b3140',
    palette: { orders: '#4f7cff', payments: '#12b886', ext: '#8b93a7', rect: '#4f7cff', round: '#12b886', cylinder: '#f59f00', diamond: '#e64980' },
    scene: { background: ['#fbfbfd', '#dfe2e8'], ground: 'none', grid: '#e1e4ea', ui: 'light' },
    zone: { style: 'slab', height: 0.35, radius: 0.12, fill: 'white', shadow: 0.22, label: 'corner', labelColor: 'group', sub: 'count' },
    node: { style: 'solid', height: 0.6, top: 'white', outline: '', shadow: 0.28, sub: 'none' },

    label: { font: 'sans', case: 'none', placement: 'top', color: '#1f2430' } },
  blueprint: { name: 'Blueprint', colorBy: 'none', ink: '#d6ecff',
    palette: { orders: '#d6ecff', payments: '#d6ecff', ext: '#d6ecff', rect: '#d6ecff', round: '#d6ecff', cylinder: '#d6ecff', diamond: '#d6ecff' },
    scene: { background: '#0b3a6e', ground: 'blueprint', grid: '#164a85', ui: 'dark', titleBlock: true },
    zone: { style: 'wire', height: 0.25, radius: 0.01, fill: 'group', shadow: 0, label: 'corner', labelColor: '#d6ecff', sub: 'dims' },
    node: { style: 'wire', height: 0.7, top: 'same', outline: '', shadow: 0, sub: 'code' },
    edge: { color: '#ffffff', width: 1.1, arrows: 'end', flow: false, label: 'box', labelColor: '#d6ecff', far: '#ffffff' },
    label: { font: 'mono', case: 'upper', placement: 'top', color: '#ffffff' } },
  night: { name: 'Night', colorBy: 'subgraph', ink: '#93a8d6',
    palette: { orders: '#22d3ee', payments: '#f472b6', ext: '#93a8d6', rect: '#22d3ee', round: '#a78bfa', cylinder: '#facc15', diamond: '#f472b6' },
    scene: { background: ['#0d1426', '#03040a'], ground: 'dots', grid: '#2a3656', ui: 'dark' },
    zone: { style: 'glass', height: 0.2, radius: 0.15, fill: 'group', shadow: 0, label: 'corner', labelColor: 'group', sub: 'metrics' },
    node: { style: 'glass', height: 0.6, top: 'same', outline: '', shadow: 0, sub: 'status' },
    edge: { color: 'group', width: 2, arrows: 'end', flow: true, label: 'pill', labelColor: 'group', far: '#a78bfa' },
    label: { font: 'sans', case: 'none', placement: 'top', color: '#e8f1ff' } },
  editorial: { name: 'Editorial', colorBy: 'subgraph', ink: '#0a2540',
    palette: { orders: '#635bff', payments: '#0bb5a0', ext: '#8792a2', rect: '#635bff', round: '#0bb5a0', cylinder: '#ff9f43', diamond: '#ff5c8a' },
    scene: { background: '#f6f9fc', ground: 'none', grid: '#e3e8ef', ui: 'light' },
    zone: { style: 'slab', height: 0.55, radius: 0.3, fill: 'tint', shadow: 0.12, label: 'chip', labelColor: 'group', sub: 'none' },
    node: { style: 'solid', height: 0.65, top: 'gradient', outline: '', shadow: 0.18, sub: 'none' },
    edge: { color: 'group', width: 2, arrows: 'end', flow: false, label: 'filled', labelColor: '#ffffff', far: '#635bff' },
    label: { font: 'sans', case: 'none', placement: 'top', color: '#0a2540' } },
  map: { name: 'Map', colorBy: 'subgraph', ink: '#1d36a6',
    palette: { orders: '#6fae45', payments: '#f0a43c', ext: '#9aa3b2', rect: '#6fae45', round: '#4f7cff', cylinder: '#f0a43c', diamond: '#d9534f' },
    scene: { background: '#f5f6f9', ground: 'grid', grid: '#e1e4ea', ui: 'light' },
    zone: { style: 'floor', height: 0.08, radius: 0.5, fill: 'group', shadow: 0, label: 'ground', labelColor: '#1f2330', sub: 'none' },
    node: { style: 'icon', height: 1, top: 'same', outline: '#2a2f3a', shadow: 0, sub: 'detail' },
    edge: { color: 'ink', width: 4, arrows: 'mid', flow: false, label: 'pill', labelColor: '#333333', far: '#c8743a' },
    label: { font: 'sans', case: 'none', placement: 'callout', color: '#1f2330' } },
}

// ---------- the made-up diagram (what the source would say) ----------
const TRAYS = [
  { id: 'orders', label: 'Orders', x0: 7, y0: 0, x1: 21, y1: 5 },
  { id: 'payments', label: 'Payments', x0: 7, y0: 7, x1: 21, y1: 12 },
]
const NODES = [
  { id: 'browser', icon: 'person', detail: 'Web · mobile', code: 'EXT-01', label: 'Browser', shape: 'round', g: 'ext', cx: 1, cy: 6, w: 2, d: 1.4 },
  { id: 'gw', icon: 'switch', detail: 'Envoy · TLS', code: 'EDG-01', label: 'API Gateway', shape: 'rect', g: 'ext', cx: 4.5, cy: 6, w: 2.2, d: 1.4 },
  { id: 'oapi', icon: 'server', detail: 'Go · 3 pods', code: 'SVC-01', label: 'Order API', shape: 'rect', g: 'orders', cx: 9, cy: 2.5, w: 2.2, d: 1.4 },
  { id: 'valid', icon: 'check', detail: 'Policy', code: 'DEC-01', label: 'Valid?', shape: 'diamond', g: 'orders', cx: 12.5, cy: 2.5, w: 2, d: 2 },
  { id: 'osvc', icon: 'server', detail: 'Go · 2 pods', code: 'SVC-02', label: 'Order Svc', shape: 'rect', g: 'orders', cx: 15.5, cy: 1.5, w: 2.2, d: 1.4 },
  { id: 'reject', icon: 'server', detail: 'DLQ handler', code: 'SVC-03', label: 'Reject', shape: 'round', g: 'orders', cx: 16, cy: 3.9, w: 1.8, d: 1.1 },
  { id: 'queue', icon: 'disks', detail: 'Kafka · 6 partitions', code: 'DAT-01', label: 'Order Queue', shape: 'cylinder', g: 'orders', cx: 19, cy: 1.5, w: 1.6, d: 1.6 },
  { id: 'papi', icon: 'server', detail: 'Node · 3 pods', code: 'SVC-04', label: 'Payment API', shape: 'rect', g: 'payments', cx: 9, cy: 9.5, w: 2.2, d: 1.4 },
  { id: 'fraud', icon: 'check', detail: 'ML score', code: 'DEC-02', label: 'Fraud?', shape: 'diamond', g: 'payments', cx: 12.5, cy: 9.5, w: 2, d: 2 },
  { id: 'charge', icon: 'server', detail: 'Stripe adapter', code: 'SVC-05', label: 'Charge Card', shape: 'rect', g: 'payments', cx: 16, cy: 9.5, w: 2.2, d: 1.4 },
  { id: 'ledger', icon: 'disks', detail: 'Postgres · HA', code: 'DAT-02', label: 'Ledger', shape: 'cylinder', g: 'payments', cx: 19, cy: 9.5, w: 1.6, d: 1.6 },
]
const EDGES = [
  { pts: [[2, 6], [3.4, 6]], label: 'HTTPS', g: 'ext' },
  { pts: [[5.6, 6], [6.3, 6], [6.3, 2.5], [7.9, 2.5]], g: 'orders' },
  { pts: [[5.6, 6], [6.3, 6], [6.3, 9.5], [7.9, 9.5]], g: 'payments' },
  { pts: [[10.1, 2.5], [11.5, 2.5]], g: 'orders' },
  { pts: [[13.5, 2.5], [14, 2.5], [14, 1.5], [14.4, 1.5]], label: 'yes', g: 'orders' },
  { pts: [[12.5, 3.5], [12.5, 3.9], [15.1, 3.9]], label: 'no', g: 'orders', dotted: true },
  { pts: [[16.6, 1.5], [18.2, 1.5]], g: 'orders' },
  { pts: [[10.1, 9.5], [11.5, 9.5]], g: 'payments' },
  { pts: [[13.5, 9.5], [14.9, 9.5]], label: 'ok', g: 'payments' },
  { pts: [[17.1, 9.5], [18.2, 9.5]], g: 'payments' },
]
const FAR = { from: [19, 1.5], to: [1, 6], label: 'live updates · WebSocket' }

// =====================================================================================
// iso drawing primitives
// =====================================================================================
const C = Math.cos(Math.PI / 6), SN = 0.5, U = 36
let out, late, mini, uid = 0, T, TRAY_TOP = 0.25
const id = n => n + uid
const P = (x, y, z) => [(x - y) * C * U, (x + y) * SN * U - z * U]
const pts = a => a.map(p => P(...p).map(v => v.toFixed(1)).join(',')).join(' ')
const poly = (a, fill, extra = '') => out.push(`<polygon points="${pts(a)}" fill="${fill}" stroke="${fill.startsWith('url') || fill.length > 7 ? 'none' : fill}" stroke-width=".6" stroke-linejoin="round" ${extra}/>`)
const polyS = (a, fill, stroke, sw = 1, extra = '') => out.push(`<polygon points="${pts(a)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" ${extra}/>`)
const ln = (a, b) => `x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"`
function shade(hex, k) {
  const n = parseInt(hex.slice(1, 7), 16)
  const f = v => Math.max(0, Math.min(255, Math.round(k > 1 ? v + (255 - v) * (k - 1) : v * k))).toString(16).padStart(2, '0')
  return '#' + f(n >> 16) + f((n >> 8) & 255) + f(n & 255)
}
const inTray = (x, y) => TRAYS.some(t => x >= t.x0 && x <= t.x1 && y >= t.y0 && y <= t.y1)
const groundZ = (x, y) => inTray(x, y) ? TRAY_TOP : 0
function rectPlan(cx, cy, w, d, r = 0.1) {
  r = Math.min(r, w / 2 - 0.01, d / 2 - 0.01)
  const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - d / 2, y1 = cy + d / 2, a = []
  const arc = (ox, oy, s) => { for (let i = 0; i <= 4; i++) { const t = s + i / 4 * Math.PI / 2; a.push([ox + r * Math.cos(t), oy + r * Math.sin(t)]) } }
  arc(x1 - r, y0 + r, -Math.PI / 2); arc(x1 - r, y1 - r, 0); arc(x0 + r, y1 - r, Math.PI / 2); arc(x0 + r, y0 + r, Math.PI)
  return a
}
const circlePlan = (cx, cy, rx, ry, n = 40) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(i / n * 2 * Math.PI), cy + ry * Math.sin(i / n * 2 * Math.PI)])
// in iso a diamond (a square turned 45°) reads as a flat card, so decisions draw as hexagonal prisms
const hexPlan = n => Array.from({ length: 6 }, (_, i) => { const a = Math.PI / 12 + i * Math.PI / 3; return [n.cx + n.w / 2 * Math.cos(a), n.cy + n.d / 2 * Math.sin(a)] })
const planOf = n => n.shape === 'cylinder' ? circlePlan(n.cx, n.cy, n.w / 2, n.d / 2) : n.shape === 'diamond' ? hexPlan(n) : rectPlan(n.cx, n.cy, n.w, n.d, n.shape === 'round' ? Math.min(n.w, n.d) / 2 * 0.95 : 0.12)
const trayPlan = (t, r) => rectPlan((t.x0 + t.x1) / 2, (t.y0 + t.y1) / 2, t.x1 - t.x0, t.y1 - t.y0, r)
function frontEdges(plan) { const n = plan.length; let area = 0; for (let i = 0; i < n; i++) { const [a, b] = plan[i], [c, d] = plan[(i + 1) % n]; area += a * d - c * b } const sg = area > 0 ? 1 : -1, r = []; for (let i = 0; i < n; i++) { const [a, b] = plan[i], [c, d] = plan[(i + 1) % n]; if (((d - b) - (c - a)) * sg > 1e-9) r.push([plan[i], plan[(i + 1) % n]]) } return r }
function extrude(plan, z0, z1, side, top, o = {}) {
  const n = plan.length; let area = 0
  for (let i = 0; i < n; i++) { const [a, b] = plan[i], [c, d] = plan[(i + 1) % n]; area += a * d - c * b }
  const sg = area > 0 ? 1 : -1, faces = [], smooth = n > 20
  for (let i = 0; i < n; i++) {
    const [a, b] = plan[i], [c, d] = plan[(i + 1) % n]
    let nx = (d - b) * sg, ny = -(c - a) * sg
    if (nx + ny <= 1e-9) continue
    ny /= Math.hypot(nx, ny)
    faces.push({ k: a + b + c + d, q: [[a, b, z0], [c, d, z0], [c, d, z1], [a, b, z1]], f: shade(side, (o.lo ?? 0.72) + (o.span ?? 0.22) * ny) })
  }
  faces.sort((p, q) => p.k - q.k).forEach(f => o.ol && !smooth ? polyS(f.q, f.f, o.ol, 0.9) : poly(f.q, f.f))
  if (o.ol && smooth) {
    const sx = plan.map(([x, y]) => P(x, y, 0)[0])
    for (const i of [sx.indexOf(Math.min(...sx)), sx.indexOf(Math.max(...sx))]) out.push(`<line ${ln(P(...plan[i], z0), P(...plan[i], z1))} stroke="${o.ol}" stroke-width=".9"/>`)
    frontEdges(plan).forEach(([p, q]) => out.push(`<line ${ln(P(...p, z0), P(...q, z0))} stroke="${o.ol}" stroke-width=".9"/>`))
  }
  if (top !== null) o.ol ? polyS(plan.map(([x, y]) => [x, y, z1]), top ?? side, o.ol, 0.9) : poly(plan.map(([x, y]) => [x, y, z1]), top ?? side)
  if (o.rim) polyS(plan.map(([x, y]) => [x, y, z1]), 'none', o.rim, 1.3, `filter="url(#${id('glow')})"`)
}
function wire(plan, z0, z1, col, fill = 'none') {
  polyS(plan.map(([x, y]) => [x, y, z0]), 'none', col, 0.8, 'stroke-dasharray="3 3" opacity=".5"')
  const sx = plan.map(([x, y]) => P(x, y, 0)[0]), depth = plan.map(([x, y]) => x + y)
  for (const i of new Set([sx.indexOf(Math.min(...sx)), sx.indexOf(Math.max(...sx)), depth.indexOf(Math.max(...depth))])) out.push(`<line ${ln(P(...plan[i], z0), P(...plan[i], z1))} stroke="${col}" stroke-width="1.1"/>`)
  frontEdges(plan).forEach(([p, q]) => out.push(`<line ${ln(P(...p, z0), P(...q, z0))} stroke="${col}" stroke-width="1.1"/>`))
  polyS(plan.map(([x, y]) => [x, y, z1]), fill, col, 1.2)
}
function softShadow(plan, z, dx, dy, op, blur) { if (op > 0) poly(plan.map(([x, y]) => [x + dx, y + dy, z + 0.001]), `rgba(20,28,50,${op})`, `filter="url(#${id('blur' + blur)})"`) }
const FONTS = { sans: 'Inter,system-ui,sans-serif', mono: 'JetBrains Mono,ui-monospace,Menlo,monospace' }
const cased = s => T.label.case === 'upper' ? s.toUpperCase() : s
function topLabel(x, y, z, text, o = {}) {
  if (mini) return
  const [X, Y] = P(x, y, z)
  out.push(`<text transform="matrix(${C},${SN},${-C},${SN},${X.toFixed(1)},${Y.toFixed(1)})" font-family="${o.font || FONTS[T.label.font]}" font-size="${o.size || 12}" font-weight="${o.weight || 600}" fill="${o.color}" text-anchor="${o.anchor || 'middle'}" dominant-baseline="middle" letter-spacing="${o.ls || 0}">${text}</text>`)
}
function pill(X, Y, text, o) {
  if (mini) return
  const w = text.length * (o.size || 10) * 0.62 + 16, h = (o.size || 10) + 10
  late.push(`<rect x="${X - w / 2}" y="${Y - h / 2}" width="${w}" height="${h}" rx="${o.r ?? h / 2}" fill="${o.bg}" stroke="${o.border || 'none'}" stroke-width="1" ${o.extra || ''}/>`)
  late.push(`<text x="${X}" y="${Y + 0.5}" font-family="${FONTS[T.label.font]}" font-size="${o.size || 10}" font-weight="${o.weight || 600}" fill="${o.color}" text-anchor="middle" dominant-baseline="middle">${text}</text>`)
}
const edgeScreen = e => e.pts.map(([x, y]) => P(x, y, groundZ(x, y) + 0.03))
const pathD = s => 'M' + s.map(p => p.map(v => v.toFixed(1)).join(',')).join(' L')
function tri(mx, my, ux, uy, k, col) { late.push(`<polygon points="${mx},${my} ${mx - ux * k * 1.8 - uy * k * .75},${my - uy * k * 1.8 + ux * k * .75} ${mx - ux * k * 1.8 + uy * k * .75},${my - uy * k * 1.8 - ux * k * .75}" fill="${col}"/>`) }
function edgeMid(e) {
  let best = 0, bi = 0
  for (let i = 0; i < e.pts.length - 1; i++) { const l = Math.hypot(e.pts[i + 1][0] - e.pts[i][0], e.pts[i + 1][1] - e.pts[i][1]); if (l > best) { best = l; bi = i } }
  const [a, b] = [e.pts[bi], e.pts[bi + 1]], x = (a[0] + b[0]) / 2, y = (a[1] + b[1]) / 2
  return P(x, y, groundZ(x, y))
}
const isLight = () => T.scene.ui === 'light'

// =====================================================================================
// THE RENDERER: one function per part, each reading tokens. No theme names in here.
// =====================================================================================
const colorOf = key => T.colorBy === 'none' ? T.ink : T.palette[key] || T.ink
const nodeColor = n => colorOf(T.colorBy === 'shape' ? n.shape : n.g)
const zoneColor = t => colorOf(T.colorBy === 'shape' ? 'rect' : t.id)
const resolve = (v, c) => v === 'group' ? c : v === 'ink' ? T.ink : v

function drawScene() {
  const s = T.scene, bg = Array.isArray(s.background) ? `url(#${id('bg')})` : s.background
  out.push(`<rect x="-5000" y="-5000" width="10000" height="10000" fill="${bg}"/>`)
  const g = s.grid
  if (s.ground === 'grid' || s.ground === 'blueprint') {
    const major = i => s.ground === 'blueprint' && i % 5 === 0
    for (let i = -6; i <= 27; i++) out.push(`<line ${ln(P(i, -6, 0), P(i, 18, 0))} stroke="${major(i) ? shade(g, 1.35) : g}" stroke-width="${major(i) ? 1 : .7}"/>`)
    for (let j = -6; j <= 18; j++) out.push(`<line ${ln(P(-6, j, 0), P(27, j, 0))} stroke="${major(j) ? shade(g, 1.35) : g}" stroke-width="${major(j) ? 1 : .7}"/>`)
  } else if (s.ground === 'dots' && !mini) {
    for (let i = -4; i <= 25; i++) for (let j = -4; j <= 16; j++) { const [X, Y] = P(i, j, 0); out.push(`<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r=".9" fill="${g}"/>`) }
  }
}

function drawZone(t) {
  const z = T.zone, c = zoneColor(t), plan = trayPlan(t, z.radius), h = TRAY_TOP
  softShadow(plan, 0, -0.5 * z.height - 0.2, 0.4 + z.height, z.shadow, 8)
  if (z.style === 'wire') wire(plan, 0, h, T.ink, 'rgba(160,210,255,0.05)')
  else if (z.style === 'glass') { extrude(plan, 0, h, '#0b1120', c + '14', { lo: .9, span: .1, rim: c }) }
  else {
    const fill = z.fill === 'white' ? ['#e9ebf0', '#ffffff'] : z.fill === 'tint' ? [shade(c, 1.45), `url(#${id('tint-' + t.id)})`] : z.fill === 'group' ? [shade(c, .85), c] : [z.fill, z.fill]
    extrude(plan, 0, h, fill[0], fill[1], { lo: z.fill === 'white' ? .86 : .75, span: .15 })
  }
  const lc = resolve(z.labelColor, isLight() && z.labelColor === 'group' ? shade(c, .8) : c)
  if (z.label === 'corner') {
    topLabel(t.x0 + 0.35, t.y0 + 0.55, h + .01, cased(t.label), { size: 12, color: lc, weight: 700, anchor: 'start', ls: T.label.case === 'upper' ? 1.5 : 0 })
    const sub = { count: NODES.filter(n => n.g === t.id).length + ' components', metrics: 'p99 142ms · 1.2k rps' }[z.sub]
    if (sub) topLabel(t.x0 + 0.35, t.y0 + 1.0, h + .01, sub, { size: 9, color: shade(lc, isLight() ? 1.4 : .65), weight: 500, anchor: 'start' })
  } else if (z.label === 'chip' && !mini) {
    const [X, Y] = P(t.x0 + 1.3, t.y0 + 0.5, h + 0.35); pill(X, Y, '● ' + t.label, { bg: '#fff', color: lc, size: 11, extra: 'filter="drop-shadow(0 4px 10px rgba(10,37,64,.15))"' })
  } else if (z.label === 'ground') {
    topLabel(t.x0 + 0.1, t.y1 + 0.75, 0, cased(t.label), { size: 30, weight: 800, color: lc, anchor: 'start', ls: -0.5 })
  }
  if (z.sub === 'dims') {
    const y = t.y1 + 0.7, I = T.ink
    out.push(`<line ${ln(P(t.x0, y, 0), P(t.x1, y, 0))} stroke="${I}" stroke-width=".8"/>`)
    for (const x of [t.x0, t.x1]) out.push(`<line ${ln(P(x, t.y1 + .2, 0), P(x, y + .25, 0))} stroke="${I}" stroke-width=".8"/><line ${ln(P(x - .12, y - .12, 0), P(x + .12, y + .12, 0))} stroke="${I}" stroke-width="1.2"/>`)
    topLabel((t.x0 + t.x1) / 2, y - .25, 0, `${NODES.filter(n => n.g === t.id).length} COMPONENTS · ${EDGES.filter(e => e.g === t.id).length} FLOWS`, { size: 9, color: I, font: FONTS.mono, weight: 400, ls: 1 })
  }
}

function drawEdge(e) {
  const E = T.edge, c = resolve(E.color, colorOf(T.colorBy === 'subgraph' ? e.g : 'ext')), s = edgeScreen(e), d = pathD(s), w = mini ? Math.max(1, E.width / 2) : E.width
  if (E.flow) {
    out.push(`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w * .6}" opacity=".35"/>`)
    out.push(`<path class="flow" d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-dasharray="3 13" stroke-linecap="round" filter="url(#${id('glow')})"/>`)
  } else out.push(`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" ${e.dotted ? `stroke-dasharray="0.1 ${w + 4}" stroke-linecap="round"` : ''}/>`)
  if (mini) return
  const head = isLight() && E.arrows === 'mid' ? '#111' : c
  if (E.arrows === 'mid') {
    for (let i = 0; i < s.length - 1; i++) { const [ax, ay] = s[i], [bx, by] = s[i + 1], l = Math.hypot(bx - ax, by - ay); if (l < 34) continue; const ux = (bx - ax) / l, uy = (by - ay) / l; tri((ax + bx) / 2 + ux * 6, (ay + by) / 2 + uy * 6, ux, uy, 6, head) }
  } else { const [ax, ay] = s[s.length - 2], [bx, by] = s[s.length - 1], l = Math.hypot(bx - ax, by - ay); tri(bx, by, (bx - ax) / l, (by - ay) / l, 2.6 + w, c) }
  if (e.label) {
    const [X, Y] = edgeMid(e), lc = resolve(E.labelColor, c), txt = cased(e.label)
    if (E.label === 'text') late.push(`<text x="${X}" y="${Y - 12}" font-family="${FONTS[T.label.font]}" font-size="11" font-weight="700" fill="${lc}" text-anchor="middle" stroke="${isLight() ? '#fff' : '#000'}" stroke-width="3" paint-order="stroke">${txt}</text>`)
    else if (E.label === 'filled') pill(X, Y - 4, txt, { bg: c, color: '#fff', size: 9 })
    else if (E.label === 'box') pill(X, Y - 4, txt, { bg: T.scene.background, color: lc, border: lc, size: 8, r: 0 })
    else pill(X, Y - 6, txt, { bg: isLight() ? '#fff' : '#0b1120', color: lc, border: isLight() ? '#cfd4dd' : c + '88', size: 9, r: isLight() && E.arrows === 'mid' ? 3 : undefined })
  }
}

function drawFar() {
  const a = P(...FAR.from, 0.9), b = P(...FAR.to, 1.2), c = [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - 260], w = mini ? 2 : Math.max(2, T.edge.width)
  out.push(`<path d="M${a} Q${c} ${b}" fill="none" stroke="${T.edge.far}" stroke-width="${w}" stroke-dasharray="${mini ? '4 4' : `${w * 2.6} ${w * 2}`}" stroke-linecap="round"/>`)
  if (!mini) pill((a[0] + 2 * c[0] + b[0]) / 4, (a[1] + 2 * c[1] + b[1]) / 4, cased(FAR.label), { bg: isLight() ? '#fff' : '#0b1120', color: T.edge.far, border: T.edge.far + '88', size: 9, r: 3 })
}

function drawIcon(n, z, c) {
  const o = { ol: T.node.outline || '#2a2f3a', lo: 0.78, span: 0.2 }, { cx, cy } = n, light = '#dfe3ec', top = '#f6f7fa'
  if (n.icon === 'server') {
    extrude(rectPlan(cx, cy, 1, 1, 0.01), z, z + 1, light, top, o)
    for (const h of [.33, .66]) out.push(`<line ${ln(P(cx - .5, cy + .5, z + h), P(cx + .5, cy + .5, z + h))} stroke="${o.ol}" stroke-width=".9"/><line ${ln(P(cx + .5, cy - .5, z + h), P(cx + .5, cy + .5, z + h))} stroke="${o.ol}" stroke-width=".9"/>`)
    for (const h of [.16, .49, .82]) { const [X, Y] = P(cx + .5, cy + .32, z + h); out.push(`<circle cx="${X}" cy="${Y}" r="1.6" fill="${c}"/>`) }
    return z + 1
  }
  if (n.icon === 'switch') { extrude(rectPlan(cx, cy, 1.5, .8, .01), z, z + .3, light, top, o); for (let k = 0; k < 8; k++) { const x = cx - .62 + k * .16; poly([[x, cy + .4, z + .08], [x + .1, cy + .4, z + .08], [x + .1, cy + .4, z + .2], [x, cy + .4, z + .2]], o.ol) } return z + .3 }
  if (n.icon === 'disks') { for (let k = 0; k < 3; k++) extrude(circlePlan(cx, cy, .55, .55), z + k * .27, z + k * .27 + .22, light, top, o); return z + .76 }
  if (n.icon === 'person') { extrude(circlePlan(cx, cy, .33, .33), z, z + .55, '#cfd5e2', '#e9ecf3', o); const [X, Y] = P(cx, cy, z + .85); out.push(`<circle cx="${X}" cy="${Y}" r="${mini ? 3 : 10}" fill="#e9ecf3" stroke="${o.ol}" stroke-width=".9"/>`); return z + 1.05 }
  extrude(hexPlan({ cx, cy, w: 1.3, d: 1.3 }), z, z + .45, c, shade(c, 1.25), o)
  return z + .45
}

function drawNode(n, z) {
  const N = T.node, c = nodeColor(n), h = N.height
  let top = z + h
  if (N.shadow) softShadow(planOf(n), z, -.12, .22, N.shadow, 3)
  if (N.style === 'icon') top = drawIcon(n, z, c)
  else if (N.style === 'wire') wire(planOf(n), z, z + h, T.ink, 'rgba(160,210,255,0.10)')
  else if (N.style === 'glass') extrude(planOf(n), z, z + h, '#1a2338', '#0e1526', { lo: .55, span: .35, rim: c })
  else extrude(planOf(n), z, z + h, c, N.top === 'white' ? '#ffffff' : N.top === 'gradient' ? `url(#${id('ng-' + c.slice(1))})` : c, { lo: N.top === 'same' ? .6 : .72, span: .25, ol: N.outline || undefined })
  // label
  const sub = { code: n.code, detail: n.detail, status: n.shape === 'cylinder' ? '● healthy' : '● 3 pods', none: '' }[N.sub]
  if (T.label.placement === 'callout') {
    if (mini) return
    const [X, Y] = P(n.cx, n.cy, top), cy0 = Y - 34, w = Math.max(n.label.length * 6.6, (sub || '').length * 5.6) + 18, hh = sub ? 32 : 20
    late.push(`<line x1="${X}" y1="${Y - 2}" x2="${X}" y2="${cy0}" stroke="${isLight() ? '#333' : '#aab'}" stroke-width="1.2" stroke-dasharray="1.5 3"/>`)
    late.push(`<rect x="${X - w / 2}" y="${cy0 - hh}" width="${w}" height="${hh}" rx="3" fill="${isLight() ? '#fff' : '#121826'}" stroke="${isLight() ? '#cfd4dd' : '#3a4560'}"/>`)
    late.push(`<text x="${X - w / 2 + 9}" y="${cy0 - hh + 13}" font-family="${FONTS[T.label.font]}" font-size="11" font-weight="700" fill="${T.label.color}">${cased(n.label)}</text>`)
    if (sub) late.push(`<text x="${X - w / 2 + 9}" y="${cy0 - hh + 26}" font-family="${FONTS[T.label.font]}" font-size="9.5" fill="${shade(T.label.color, isLight() ? 1.5 : .7)}">${sub}</text>`)
  } else {
    const lc = N.style === 'solid' && N.top === 'same' && !isLight() ? T.label.color : N.style === 'solid' && N.top === 'same' ? '#ffffff' : T.label.color
    topLabel(n.cx, n.cy - (sub ? .12 : 0), top + .01, cased(n.label), { size: T.label.font === 'mono' ? 9 : 11, color: lc })
    if (sub) topLabel(n.cx, n.cy + .3, top + .01, sub, { size: 8, color: N.style === 'glass' ? c : shade(lc, isLight() ? 1.5 : .7), weight: 500 })
  }
}

function render(theme, small = false) {
  T = theme; out = []; late = []; mini = small; uid++
  TRAY_TOP = T.zone.height
  const bg = T.scene.background
  const tints = TRAYS.map(t => { const c = zoneColor(t); return `<linearGradient id="${id('tint-' + t.id)}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(c, 1.88)}"/><stop offset="1" stop-color="${shade(c, 1.72)}"/></linearGradient>` }).join('')
  const ngs = [...new Set(NODES.map(nodeColor))].map(c => `<linearGradient id="${id('ng-' + c.slice(1))}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="${shade(c, 1.82)}"/></linearGradient>`).join('')
  out.push(`<defs><filter id="${id('blur3')}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="${id('blur8')}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="${id('glow')}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    ${Array.isArray(bg) ? `<radialGradient id="${id('bg')}" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="${bg[0]}"/><stop offset="1" stop-color="${bg[1]}"/></radialGradient>` : ''}${tints}${ngs}</defs>`)
  drawScene()
  TRAYS.forEach(drawZone)
  EDGES.forEach(drawEdge)
  NODES.slice().sort((a, b) => (a.cx + a.cy) - (b.cx + b.cy)).forEach(n => drawNode(n, groundZ(n.cx, n.cy)))
  drawFar()
  const [xa] = P(-2, 14, 0), [xb] = P(23, -1, 0), [, ya] = P(-1, -1, 4), [, yb] = P(22, 13, -1.5)
  return `<svg viewBox="${(xa - 20).toFixed(0)} ${(ya - 20).toFixed(0)} ${(xb - xa + 40).toFixed(0)} ${(yb - ya + 40).toFixed(0)}" preserveAspectRatio="xMidYMid ${small ? 'slice' : 'meet'}">${out.join('')}${late.join('')}</svg>`
}

// =====================================================================================
// UI
// =====================================================================================
const clone = o => JSON.parse(JSON.stringify(o))
const get = (o, p) => p.split('.').reduce((a, k) => a?.[k], o)
const set = (o, p, v) => { const ks = p.split('.'), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v }
const flat = (o, pre = '') => Object.entries(o).flatMap(([k, v]) => v && typeof v === 'object' && !Array.isArray(v) ? flat(v, pre + k + '.') : [[pre + k, v]])
let base = START, theme = clone(PRESETS[START])
const overrides = () => { const b = Object.fromEntries(flat(PRESETS[base])); return flat(theme).filter(([k, v]) => k !== 'name' && JSON.stringify(b[k]) !== JSON.stringify(v)) }

const CONTROLS = [
  ['Colour', [['colorBy', 'seg', ['subgraph', 'shape', 'none']], ['palette.orders', 'color', 'Orders'], ['palette.payments', 'color', 'Payments'], ['palette.ext', 'color', 'Outside'], ['ink', 'color', 'Ink']]],
  ['Scene', [['scene.background', 'color', 'Background'], ['scene.ground', 'seg', ['none', 'grid', 'blueprint', 'dots']], ['scene.grid', 'color', 'Grid'], ['scene.ui', 'seg', ['light', 'dark'], 'Chrome']]],
  ['Subgraphs', [['zone.style', 'seg', ['slab', 'floor', 'glass', 'wire']], ['zone.fill', 'seg', ['group', 'tint', 'white']], ['zone.height', 'range', [0.04, 1.2]], ['zone.radius', 'range', [0, 0.8]], ['zone.shadow', 'range', [0, 0.4]], ['zone.label', 'seg', ['corner', 'chip', 'ground']], ['zone.sub', 'seg', ['none', 'count', 'metrics', 'dims']]]],
  ['Nodes', [['node.style', 'seg', ['solid', 'glass', 'wire', 'icon']], ['node.top', 'seg', ['same', 'white', 'gradient']], ['node.height', 'range', [0.2, 1.4]], ['node.shadow', 'range', [0, 0.4]], ['node.sub', 'seg', ['none', 'detail', 'code', 'status'], 'Second line']]],
  ['Edges', [['edge.color', 'seg', ['ink', 'group']], ['edge.width', 'range', [1, 6]], ['edge.arrows', 'seg', ['end', 'mid']], ['edge.flow', 'seg', [false, true], 'Flow'], ['edge.label', 'seg', ['text', 'pill', 'filled', 'box']], ['edge.far', 'color', 'Long-haul']]],
  ['Labels', [['label.font', 'seg', ['sans', 'mono']], ['label.case', 'seg', ['none', 'upper']], ['label.placement', 'seg', ['top', 'callout']], ['label.color', 'color', 'Colour']]],
]

function codePanel() {
  const ov = overrides(), ovk = new Set(ov.map(o => o[0]))
  const yaml = v => typeof v === 'string' ? `<span class="s">${/^#/.test(v) ? `"${v}"` : v}</span>` : `<span class="s">${JSON.stringify(v)}</span>`
  const fm = `<span class="c">---</span>
<span class="k">config</span>:
  <span class="k">theme</span>: ${yaml(base)}       <span class="c"># built-in, or ./themes/acme.json</span>
${ov.length ? `  <span class="k">themeVariables</span>:   <span class="c"># only what differs</span>\n` + ov.map(([k, v]) => `    <span class="k">${k}</span>: ${yaml(v)}`).join('\n') : '  <span class="c"># no overrides</span>'}
<span class="c">---</span>
flowchart LR
  subgraph orders[Orders]
    oapi[Order API]@{ <span class="k">icon</span>: <span class="s">server</span>, <span class="k">detail</span>: <span class="s">"Go · 3 pods"</span> }
    queue[(Order Queue)]@{ <span class="k">icon</span>: <span class="s">disks</span> }
  end
  queue -.-&gt; browser   <span class="c">%% long-haul: drawn as an arc</span>
  classDef critical <span class="k">stroke</span>:<span class="s">#e5484d</span>   <span class="c">%% per-node, as in Mermaid</span>`
  let last = ''
  const tokens = flat(theme).filter(([k]) => k !== 'name').map(([k, v]) => {
    const [sec, ...rest] = k.split('.'), head = rest.length && sec !== last ? `<span class="k">${sec}</span>:\n` : ''; if (rest.length) last = sec
    const line = `${rest.length ? '  ' : ''}<span class="k">${rest.length ? rest.join('.') : k}</span>: ${yaml(v)}`
    return head + (ovk.has(k) ? `<span class="chg">${line}</span>` : line)
  }).join('\n')
  return `<h4>In the diagram</h4><pre>${fm}</pre><h4>The theme file · themes/${base}${ov.length ? '-custom' : ''}.yaml</h4><pre>${tokens}</pre>
    <div class="btns"><button class="b">Save as new theme…</button><button class="b">Export</button><button class="b">Import</button></div>`
}

function controls() {
  const ovk = new Set(overrides().map(o => o[0]))
  return CONTROLS.map(([g, list]) => `<div class="grp"><h4>${g}</h4>${list.map(([p, kind, opt, lbl]) => {
    const v = get(theme, p), name = typeof opt === 'string' ? opt : lbl || p.split('.').pop()
    let input = ''
    if (kind === 'seg') input = `<span class="seg">${opt.map(o => `<span data-p="${p}" data-v='${JSON.stringify(o)}' class="${JSON.stringify(o) === JSON.stringify(v) ? 'on' : ''}">${o === true ? 'on' : o === false ? 'off' : o}</span>`).join('')}</span>`
    if (kind === 'color') input = `<input type="color" data-p="${p}" value="${Array.isArray(v) ? v[0] : /^#[0-9a-f]{6}$/i.test(v) ? v : '#888888'}">`
    if (kind === 'range') input = `<input type="range" data-p="${p}" min="${opt[0]}" max="${opt[1]}" step="0.01" value="${v}">`
    return `<div class="ctl ${ovk.has(p) ? 'chg' : ''}"><label>${name}</label>${input}</div>`
  }).join('')}</div>`).join('')
}

function mountEditor() {
  document.body.innerHTML = `<div id="editor">
    <div class="side"><h3>Theme</h3>
      <div class="preset"><select id="preset">${Object.entries(PRESETS).map(([k, p]) => `<option value="${k}" ${k === base ? 'selected' : ''}>${p.name}</option>`).join('')}</select><span class="edited" id="edited"></span></div>
      <div id="ctls"></div></div>
    <div class="stage" id="stage"><div class="bar"><button class="b">flat</button><button class="b on">iso</button><button class="b">3d</button><button class="b">◐ Done</button></div><div id="preview"></div><div id="overlay"></div></div>
    <div class="code" id="code"></div></div>
    <div class="note" style="left:304px;bottom:12px"><b>Sketch: the theme system</b>A theme is plain data: the tokens on the left, the file on the right. One renderer reads them, and the six built-ins are only presets of the same tokens. Change anything and the preview redraws; edited tokens turn yellow. The diagram names a theme and overrides only what differs (Mermaid’s <code>theme</code> + <code>themeVariables</code>), with <code>classDef</code> for single nodes and <code>@{ icon, detail }</code> for per-node data. Made-up diagram.</div>`
  const draw = () => {
    document.getElementById('preview').innerHTML = render(theme)
    document.getElementById('overlay').innerHTML = theme.scene.titleBlock ? `<div class="tb"><div class="t">CHECKOUT PLATFORM</div><div><span class="k">DRAWN</span><br>merman</div><div><span class="k">REV</span><br>3 · 2026-11-13</div><div><span class="k">SOURCE</span><br>large.mmd</div><div><span class="k">SHEET</span><br>1 / 1 · ISO</div></div>` : ''
    document.getElementById('ctls').innerHTML = controls()
    document.getElementById('code').innerHTML = codePanel()
    const n = overrides().length; document.getElementById('edited').textContent = n ? `● ${n} edited` : ''
  }
  document.getElementById('preset').onchange = e => { base = e.target.value; theme = clone(PRESETS[base]); draw() }
  document.getElementById('ctls').addEventListener('click', e => { const p = e.target.dataset.p; if (p && e.target.dataset.v) { set(theme, p, JSON.parse(e.target.dataset.v)); draw() } })
  document.getElementById('ctls').addEventListener('input', e => { const p = e.target.dataset.p; if (!p) return; set(theme, p, e.target.type === 'range' ? +e.target.value : e.target.value); draw() })
  draw()
}

function mountPicker() {
  const t = PRESETS[base]
  if (t.scene.ui === 'light') document.body.classList.add('light')
  document.body.innerHTML = `<div id="app"><div class="scene">${render(t)}</div>
    <div class="bar"><button class="b">flat</button><button class="b on">iso</button><button class="b">3d</button><span style="width:8px"></span><button class="b">labels</button><button class="b">fit</button><a class="b on">◐ ${t.name} ▾</a><select class="b"><option>large</option></select><button class="b">source</button></div>
    <div class="pop"><h4><span>Theme</span><a class="b" href="theme-editor.html">Customise…</a></h4><div class="cards">${Object.entries(PRESETS).map(([k, p]) => `<div class="card ${k === base ? 'on' : ''}"><div class="th">${render(p, true)}</div><div class="nm">${p.name}</div></div>`).join('')}</div>
    <div class="row"><span>Built-in themes are presets of one token set. Pick one for this diagram, or <b>Customise…</b> to edit its tokens.</span><label><input type="checkbox" checked> save in diagram</label></div></div>
    <div class="note" style="right:12px;bottom:12px"><b>Sketch: picking a theme</b>The toolbar's theme menu. Each card is the same diagram, drawn by the same renderer from a different preset. Picking one writes <code>theme: map</code> into the diagram's frontmatter. <i>Customise…</i> opens the editor on that preset. Made-up diagram.</div></div>`
  document.body.style.background = Array.isArray(t.scene.background) ? t.scene.background[1] : t.scene.background
}
MODE === 'editor' ? mountEditor() : mountPicker()
</script>
</body></html>
