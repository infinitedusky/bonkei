<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.esm.min.mjs'
const SRC = 'ishikawa-beta\n    Blurry Photo\n    Process\n        Out of focus\n        Shutter speed too slow\n        Protective film not removed\n        Beautification filter applied\n    User\n        Shaky hands\n    Equipment\n        LENS\n            Inappropriate lens\n            Damaged lens\n                Bad case\n            Dirty lens\n        SENSOR\n            Damaged sensor\n            Dirty sensor\n    Environment\n        Subject moved too quickly\n        Too dark'
mermaid.initialize({ startOnLoad: false, theme: 'default' })
document.getElementById('ver').textContent = '(v12, its default theme)'
try { const { svg } = await mermaid.render('fish', SRC); document.getElementById('mm').innerHTML = svg }
catch (e) { document.getElementById('mm').textContent = 'Mermaid could not draw it: ' + e.message }
</script></body></html>
